apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doblura.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "doblura.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    # Identity only: with the version in here, the first upgrade would fail on
    # selector immutability.
    matchLabels: {{- include "doblura.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "doblura.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        # Without this checksum, changing the defaults values does not trigger a
        # rollout and the manager keeps the old configuration.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "doblura.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # runAsNonRoot only VERIFIES, it does not change the user: without
        # runAsUser, an image declaring root starts and then fails admission.
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "doblura.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --health-probe-bind-address=:8081
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
            - --zap-log-level={{ .Values.logLevel }}
            {{- if eq .Values.logFormat "json" }}
            - --zap-encoder=json
            {{- end }}
          env:
            {{- with .Values.watchNamespaces }}
            - name: WATCH_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- range $k, $v := .Values.defaults }}
            - name: DOBLURA_{{ $k | snakecase | upper }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: probes
              containerPort: 8081
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          # Probes by port NAME, never by number: they survive a change to the
          # configured port.
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
            # readyz reports not-ready until the informer caches sync, which
            # takes a few seconds on a busy API server. Enough failures to ride
            # that out, but few enough that a genuinely broken operator is
            # visible in `kubectl get pods`.
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Required with readOnlyRootFilesystem, or almost nothing starts.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
