apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doblura.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "doblura.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    # Identity only: with the version in here, the first upgrade would fail on
    # selector immutability.
    matchLabels: {{- include "doblura.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "doblura.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        # Without this checksum, changing the defaults values does not trigger a
        # rollout and the manager keeps the old configuration.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "doblura.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # runAsNonRoot only VERIFIES, it does not change the user: without
        # runAsUser, an image declaring root starts and then fails admission.
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "doblura.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --health-probe-bind-address=:8081
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            - --instance-probe-image={{ .Values.instanceProbe.image }}
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
            {{- if and .Values.webhook.enabled (gt (int .Values.replicaCount) 0) }}
            - --webhook-port={{ .Values.webhook.port }}
            - --webhook-service={{ include "doblura.fullname" . }}-webhook
            - --webhook-cert-secret={{ include "doblura.fullname" . }}-webhook-cert
            - --validating-webhook-config={{ include "doblura.fullname" . }}-quota
            - --mutating-webhook-config={{ include "doblura.fullname" . }}-creator
            - --max-environments-per-creator={{ .Values.webhook.maxEnvironmentsPerCreator }}
            {{- /*
            The operator's own identity, computed rather than configured: it
            creates environments on the cluster's behalf and must not be
            throttled by a person's allowance. Written here because the chart is
            the only place that knows both halves of the name.
            */}}
            - --quota-exempt-users={{ printf "system:serviceaccount:%s:%s" .Release.Namespace (include "doblura.serviceAccountName" .) }}{{ range .Values.webhook.exemptUsers }},{{ . }}{{ end }}
            {{- else }}
            # No webhook: the quota is NOT enforced, and
            # OdooTenant.spec.maxEphemeralEnvironments does nothing.
            - --webhook-port=0
            {{- end }}
            - --zap-log-level={{ .Values.logLevel }}
            {{- if eq .Values.logFormat "json" }}
            - --zap-encoder=json
            {{- end }}
          env:
            # The namespace the certificate's DNS names are built from. From the
            # pod rather than a value: a Service reachable at a name the
            # certificate does not carry is a TLS failure at admission time, and
            # the only place that cannot get this wrong is the pod itself.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.watchNamespaces }}
            - name: WATCH_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{/*
            The auxiliary images, as environment rather than by making the manager
            read the ConfigMap. They arrive before the first reconcile, and a
            manager that cannot reach the API server still knows which image to
            use.

            The ConfigMap that carried these was read by NOBODY: an operator
            pinning them to an internal registry — the whole point of the setting,
            and the only way to install this with no route to Docker Hub — got a
            ConfigMap and no effect, and pods that went on pulling from the
            internet.
            */}}
            {{- with .Values.defaults }}
            {{- with .gitImage }}
            - name: DOBLURA_GIT_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .httpImage }}
            - name: DOBLURA_HTTP_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .objectStoreImage }}
            - name: DOBLURA_OBJECT_STORE_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{/*
            And NOT a `range` over .Values.defaults as well. Both were here, so
            every one of these three was emitted TWICE and Kubernetes warned that
            the first copy may be dropped. Worse than the duplication: a range
            turns any key somebody adds to `defaults` into an environment
            variable the manager does not read — which is the shape of defect
            this project keeps finding, a value that describes what something
            else will do with nobody reading it. Three names, read in
            internal/controller/helperimages.go, written here.
            */}}
          ports:
            - name: probes
              containerPort: 8081
            {{- if and .Values.webhook.enabled (gt (int .Values.replicaCount) 0) }}
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          # Probes by port NAME, never by number: they survive a change to the
          # configured port.
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
            # readyz reports not-ready until the informer caches sync, which
            # takes a few seconds on a busy API server. Enough failures to ride
            # that out, but few enough that a genuinely broken operator is
            # visible in `kubectl get pods`.
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Required with readOnlyRootFilesystem, or almost nothing starts.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
