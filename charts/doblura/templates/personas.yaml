{{- if .Values.personas.create }}
{{/*
The personas.

This file is the whole "one interface, not three" decision made concrete. Support,
QA and consultancy do not get their own applications: they get their own
ClusterRoles, and the interface shows each of them the actions their role permits
on the same list of customers.

Two consequences worth being explicit about, because they are the reason for
doing it this way:

  * Adding a persona touches no code. It is a Role.
  * The interface has no permissions of its own — it impersonates the person, so
    Kubernetes RBAC is the only authorization in the system. A bug in the UI
    cannot grant what the human did not already have.

Bind these to your OIDC groups. They are ClusterRoles so you can bind them
cluster-wide OR per namespace with a RoleBinding, which is how you scope a
consultant to one customer's namespace.

WHO RESTORES A BACKUP: only platform. Not support, not QA, not consultancy.
Everybody from viewer up can SEE that backups exist and when the last one worked —
that is reassurance, and hiding it helps nobody. Creating an OdooRestore is
different: it puts real customers' names and real invoices onto whichever machine
was named, and the anonymised path for anybody who needs realistic data is
OdooSnapshot. The restriction is about the data, not about the risk of breaking
something.

VIEWER IS THE FLOOR. Bind it to the group your identity provider gives every
person who should see this platform at all:

  kubectl create clusterrolebinding doblura-viewer-all \
    --clusterrole=doblura-viewer --group=<your-everyone-group>

RBAC is additive, so support and QA then ADD to it rather than restating it.
Skipping this leaves support able to create environments and unable to see
whether any of them is running, because the read that answers "is it up" lives
here — and the console honestly reports that as "cannot tell" rather than
inventing a status.

NOT system:authenticated. That was the first suggestion here and it was wrong in
a way worth recording: every ServiceAccount in the cluster belongs to
system:authenticated, so binding to it hands every customer record and every
environment to every pod with a mounted token, in every namespace. Measured, not
supposed — kube-system's default ServiceAccount could list OdooTenants
cluster-wide. Kubernetes has no group meaning "authenticated humans", so the
group has to come from your identity provider; with local accounts, put the
viewer group in each account's record, which is what the accounts Secret format
is for.
*/}}
---
{{/*
VIEWER — authenticated, and nothing more.

This role exists to answer a question that has no good answer without it: what
happens to somebody who logs in through your identity provider and matches none
of your group mappings?

The two obvious answers are both wrong. Defaulting them to support means anybody
with an account in your domain can open environments and spend the quota.
Defaulting them to nothing is safe and hostile: they authenticate successfully,
land on an empty screen, and open a ticket about it.

So the default is read-only. They see the customer list and the state of things,
they create nothing, and the interface says plainly that this is a default rather
than an assignment — which turns a mystery into a question somebody can answer.

No pods/log here, deliberately. Logs are the one read that carries live customer
data, so that starts at support and not before.
*/}}
{{/*
customer — the person whose Odoo this is.

Every other persona here is for somebody who runs the platform. This one is for
the person who phones them, and it exists so the "is it working?" screen can be
handed to a customer without handing them anything else.

Meant to be bound with a RoleBinding to ONE namespace, never cluster-wide: bound
cluster-wide it would show every customer the state of every other customer's
environments, which is the one disclosure this persona must not make. The console
scopes that page by RBAC and nothing else, so the binding IS the scope.

What it can read, and why each one is needed rather than convenient:

  - odooenvironments, odootenants: the state of their own environments.
  - deployments: whether requests are actually being served. The environment's own
    phase says whether doblura finished setting it up, which is a different
    question — a Ready environment whose pod crashed an hour ago still says Ready.
  - pods: which pods belong to the environment, so the load figure adds up the
    right ones.
  - metrics.k8s.io: how much memory it is using against what it was given. Without
    this the page says it cannot tell, which is the honest answer, so this one is
    genuinely optional.

What it deliberately cannot do:

  - No pods/log. Logs carry live customer data and tracebacks, and this is the one
    persona that might be a person outside your company.
  - No secrets, no backups, no restores, and no writes of any kind. In particular
    it cannot restart anything: an environment restarted by the person reporting a
    problem, while somebody is looking into it, is worse than one nobody restarted.

Worth being clear-eyed about what reading an OdooEnvironment discloses: its spec
carries the database host and user, the repositories it builds from and the name
of the secret holding its password — not the password. That is their own
configuration rather than anybody else's, and it is more than the status page
shows, because Kubernetes cannot grant "read these four fields". If that matters
for a particular customer, do not give them an account: the page is not the only
way to tell somebody their Odoo is up.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "doblura.fullname" . }}-customer
  labels:
    {{- include "doblura.labels" . | nindent 4 }}
    doblura.dev/persona: customer
  annotations:
    doblura.dev/summary: >-
      The customer whose Odoo it is. Sees whether their own environments are up
      and how hard they are working, and can change nothing.
rules:
  - apiGroups: [doblura.dev]
    resources: [odooenvironments, odootenants]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "doblura.fullname" . }}-viewer
  labels:
    {{- include "doblura.labels" . | nindent 4 }}
    doblura.dev/persona: viewer
  annotations:
    doblura.dev/summary: >-
      Sees everything and changes nothing. The starting point for anybody in the company.
rules:
  - apiGroups: [doblura.dev]
    resources: [odootenants, odoodatabases, odooinstances, odooenvironments, odoorehearsals, odoosnapshots, odoobackups, odoorestores, reviewsets, odoobuilds]
    verbs: [get, list, watch]
  # Deployments, read-only, and nothing else from apps/.
  #
  # Because "is it up" is not a question the CRDs answer. An environment's phase
  # is Ready once the operator has finished building it, and it stays Ready while
  # the pod is crash-looping. Only the workload knows how many replicas are
  # actually answering.
  #
  # Without this the console reported every healthy environment as Down to
  # precisely the people it exists for — the read failed, and a failed read is
  # not an outage. It reads a replica count and carries no customer data, which
  # is why it is here and pods/log is not.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  # Pod metrics, when metrics-server is installed: the answer to "is it slow",
  # which is the other half of what somebody fielding a complaint needs. Also
  # just numbers.
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  # Pods themselves, but ONLY the object: their names and phases. Reading a pod
  # is not reading its logs, and logs are where the live customer data is — that
  # still starts at support.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
{{/*
SUPPORT — answers tickets, needs a scratch environment now.

Can create ephemeral environments and read what is going on. Cannot approve a
promotion, cannot touch production data, cannot see Secrets.

Note what is missing: no `delete` on odoodatabases, no write on odoosnapshots.
Support asks for a copy; it does not decide what a copy contains.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "doblura.fullname" . }}-support
  labels:
    {{- include "doblura.labels" . | nindent 4 }}
    doblura.dev/persona: support
  annotations:
    doblura.dev/summary: >-
      Fields the phone call: reads logs, restarts an environment, cannot touch data.
rules:
  # The customer list, which is the landing view for everyone.
  - apiGroups: [doblura.dev]
    resources: [odootenants, odoodatabases, odooinstances]
    verbs: [get, list, watch]
  # Its own throwaway environments. The quota webhook bounds how many.
  - apiGroups: [doblura.dev]
    resources: [odooenvironments]
    # patch and update alongside create and delete, and the reason is that
    # withholding them bought nothing. Somebody who can delete an environment and
    # create it again with different settings can already reach any state a patch
    # could reach — so denying the patch made the SAFE operation the forbidden
    # one and left the destructive workaround allowed. It also meant the console
    # could show these people an environment and no way to change it.
    verbs: [get, list, watch, create, update, patch, delete]
  # Read-only on everything else, so the list can show state.
  - apiGroups: [doblura.dev]
    resources: [odoorehearsals, odoosnapshots]
    verbs: [get, list, watch]
  # Logs, because "it does not work" needs an answer.
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
---
{{/*
QA — decides whether a release moves.

The one persona with WRITE access to the thing that matters: the approval. It
patches status on rehearsals and environments, which is how an approval is
recorded, and it cannot create or destroy anything.

That asymmetry is the point. QA's power is to say yes or no, not to build.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "doblura.fullname" . }}-qa
  labels:
    {{- include "doblura.labels" . | nindent 4 }}
    doblura.dev/persona: qa
  annotations:
    doblura.dev/summary: >-
      Opens and throws away environments to test against, on demo or anonymised data.
rules:
  - apiGroups: [doblura.dev]
    resources: [odootenants, odoodatabases, odooinstances, odooenvironments, odoorehearsals, odoosnapshots]
    verbs: [get, list, watch]
  # The approval itself. Patching the object records the decision; patching
  # status is how the operator is told about it.
  - apiGroups: [doblura.dev]
    resources: [odoorehearsals, odooenvironments]
    verbs: [patch, update]
  - apiGroups: [doblura.dev]
    resources: [odoorehearsals/status, odooenvironments/status]
    verbs: [get, patch, update]
  # What changed and why it failed.
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
---
{{/*
CONSULTANCY — talks to the customer.

Reads the whole version matrix (who is on what, what migrates when) and can spin
up an environment FOR a customer. That last verb is why this role is separate
from support: an environment with spec.forTenant set is a handover, and the
handover guardrail applies to it.

Can also read rehearsal durations, which is what "how long will our upgrade take"
is actually asking.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "doblura.fullname" . }}-consultancy
  labels:
    {{- include "doblura.labels" . | nindent 4 }}
    doblura.dev/persona: consultancy
  annotations:
    doblura.dev/summary: >-
      Delivers work: environments, backups and review sets for the customers they are on.
rules:
  - apiGroups: [doblura.dev]
    resources: [odootenants, odoodatabases, odooinstances, odoorehearsals, odoosnapshots]
    verbs: [get, list, watch]
  - apiGroups: [doblura.dev]
    resources: [odooenvironments]
    # patch and update alongside create and delete, and the reason is that
    # withholding them bought nothing. Somebody who can delete an environment and
    # create it again with different settings can already reach any state a patch
    # could reach — so denying the patch made the SAFE operation the forbidden
    # one and left the destructive workaround allowed. It also meant the console
    # could show these people an environment and no way to change it.
    verbs: [get, list, watch, create, update, patch, delete]
  # The customer record itself: version, product release, contact of record.
  - apiGroups: [doblura.dev]
    resources: [odootenants]
    verbs: [patch, update]
  # Backup SCHEDULES, and not restores. Deciding that a customer's staging server
  # should be copied nightly is consultancy work; putting a copy of production's
  # real data onto another machine is not.
  #
  # The line is about the DATA and not about the risk of breaking something. A
  # consultant who needs realistic data to reproduce a bug has OdooSnapshot,
  # which anonymises; restoring a backup puts real customers' names and real
  # invoices onto a box that was not built to hold them. That is a
  # data-protection decision, and it belongs with whoever answers for the
  # platform.
  - apiGroups: [doblura.dev]
    resources: [odoobackups, reviewsets]
    verbs: [create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
---
{{/*
PLATFORM — runs the thing.

Everything, including the catalogue: instances, capacity, cordoning, and the
snapshot pipeline that decides what a copy contains.

Deliberately NOT cluster-admin. It is the platform role for Doblura's own
resources, so binding it does not hand over the cluster.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "doblura.fullname" . }}-platform
  labels:
    {{- include "doblura.labels" . | nindent 4 }}
    doblura.dev/persona: platform
  annotations:
    doblura.dev/summary: >-
      Runs doblura itself, and is the only persona that can put a backup back.
rules:
  - apiGroups: [doblura.dev]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: [pods, pods/log, configmaps, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  # Secrets are readable but NOT writable, and not by anyone else.
  #
  # Platform needs to check that a credential exists and is wired to the right
  # object. It does not need to read values back out, and Kubernetes cannot
  # express "list without reading contents" — so this is the honest minimum, and
  # the reason no other persona gets it at all.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
  # Who has access, and granting it per customer.
  #
  # This is what the console's "People and access" page reads, and it is only on
  # this persona: listing ClusterRoles and bindings shows the shape of every
  # permission in the cluster, doblura's and everybody else's, so it is not
  # something to hand out for the sake of a nicer page. The other personas see the
  # page explain what they would need instead of an empty table.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings, rolebindings]
    verbs: [get, list, watch]
  # Granting is namespaced on purpose: a RoleBinding reaches one customer.
  # Cluster-wide grants are left to kubectl, where they get reviewed.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [create, delete]
  # bind, on doblura's own personas by name.
  #
  # Without this, Kubernetes' escalation check refuses the grant unless the
  # granter already holds every permission in the persona — which is true for
  # platform today and would silently stop being true the moment a persona gains
  # a rule platform lacks. Naming the roles is the supported way to say "you may
  # hand out exactly these", and it does NOT let anybody hand out anything else.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames:
      - {{ include "doblura.fullname" . }}-customer
      - {{ include "doblura.fullname" . }}-viewer
      - {{ include "doblura.fullname" . }}-support
      - {{ include "doblura.fullname" . }}-qa
      - {{ include "doblura.fullname" . }}-consultancy
      - {{ include "doblura.fullname" . }}-platform
{{- end }}
