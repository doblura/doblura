# Generated by controller-gen and copied by hack/sync-chart.py.
# Do NOT edit by hand: `make chart-sync` regenerates it.
#
# It lives in templates/ rather than crds/ on purpose: the ones in crds/ are
# only installed the first time and `helm upgrade` never updates them.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: odootenants.doblura.dev
  annotations:
    # keep: a `helm uninstall` must NOT take everyone's Doblura objects down
    # with it. Deleting a CRD deletes every object of that kind.
    helm.sh/resource-policy: keep
spec:
  group: doblura.dev
  names:
    kind: OdooTenant
    listKind: OdooTenantList
    plural: odootenants
    shortNames:
    - oten
    singular: odootenant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Customer
      type: string
    - jsonPath: .spec.odooVersion
      name: Odoo
      type: string
    - jsonPath: .spec.productRelease
      name: Release
      type: string
    - jsonPath: .status.databases
      name: DBs
      type: integer
    - description: Databases shared with other customers
      jsonPath: .status.sharedDatabases
      name: Shared
      type: integer
    - jsonPath: .status.ephemeralEnvironments
      name: Envs
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OdooTenantSpec describes a customer.
            properties:
              displayName:
                description: |-
                  DisplayName is what humans call them. The object name is a DNS label and
                  makes a poor thing to show people.
                minLength: 1
                type: string
              environmentDefaults:
                description: |-
                  EnvironmentDefaults is how this customer's environments are built.

                  It exists because of who creates environments. Support opens a throwaway
                  copy to reproduce a bug; QA opens one to check a fix. Neither of them knows
                  the Postgres host, the credential Secret or the filestore mode for this
                  customer, and neither of them should have to — that is the platform team's
                  decision, made once, per customer.

                  Without this the OdooEnvironment CRD is a form that cannot be filled in by
                  the people it is for: spec.image, spec.database.host, spec.database.user
                  and spec.database.passwordSecret are all required, and all four are
                  infrastructure. The mutating webhook fills them from here, so `kubectl
                  apply` with a four-line environment works exactly as the console does —
                  putting this in the console instead would have made the interface a
                  privileged path, which is the thing the impersonation design refuses.

                  Anything set explicitly on the environment wins. These are defaults, not
                  policy: a consultant pointing a rehearsal at a different server is a
                  legitimate thing to do, and the quota is what bounds the damage.
                properties:
                  database:
                    description: Database is where this customer's environments create
                      their databases.
                    properties:
                      host:
                        description: Host of the Postgres server.
                        minLength: 1
                        type: string
                      passwordSecret:
                        description: PasswordSecret is the Secret holding the "password"
                          key.
                        minLength: 1
                        type: string
                      port:
                        default: 5432
                        format: int32
                        type: integer
                      proxy:
                        description: Proxy puts a connection pooler between Odoo and
                          this server.
                        properties:
                          defaultPoolSize:
                            format: int32
                            minimum: 1
                            type: integer
                          image:
                            description: Image is the pooler. pgbouncer is what the
                              generated configuration speaks.
                            minLength: 1
                            type: string
                          maxClientConn:
                            format: int32
                            minimum: 1
                            type: integer
                          mode:
                            default: None
                            description: DatabaseProxyMode selects the proxy topology.
                            enum:
                            - None
                            - Sidecar
                            type: string
                          poolMode:
                            default: Session
                            description: |-
                              PoolMode defaults to Session, and that default is the whole point.

                              Session is the only mode that keeps a client on one server connection for
                              the life of the connection, and Odoo needs that: bus.py issues
                              `listen imbus` and then waits on the socket. Transaction pooling returns
                              the server connection to the pool the moment the transaction ends, so the
                              registration is on a backend the listener no longer holds.

                              Everything else Odoo does is transaction-scoped and would be fine —
                              ir_cron serialises with FOR NO KEY UPDATE SKIP LOCKED, mail_thread uses
                              pg_try_advisory_xact_lock. The bus is the one exception, and it is enough.
                            enum:
                            - Session
                            - Transaction
                            type: string
                          unsafeAcknowledgement:
                            description: UnsafeAcknowledgement gates Transaction.
                              See the CEL message.
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: 'proxy mode Sidecar needs an explicit image: there
                            is no sensible default, because the pooler image is the
                            one container in the pod that will hold your database
                            credential and pinning a vendor tag on your behalf is
                            not a decision this operator should make for you'
                          rule: self.mode != 'Sidecar' || has(self.image)
                        - message: 'poolMode Transaction requires unsafeAcknowledgement
                            set to its literal value: Odoo''s bus registers with LISTEN,
                            which is session state, and transaction pooling does not
                            preserve it: the failure is that live notifications silently
                            stop, and it appears under concurrency rather than in
                            testing'
                          rule: self.poolMode != 'Transaction' || (has(self.unsafeAcknowledgement)
                            && self.unsafeAcknowledgement == 'i-accept-transaction-pooling-breaks-the-odoo-bus')
                      user:
                        minLength: 1
                        type: string
                    required:
                    - host
                    - passwordSecret
                    - user
                    type: object
                  image:
                    description: Image is the Odoo image this customer's environments
                      run.
                    type: string
                  size:
                    description: Size is the default resource class.
                    enum:
                    - small
                    - medium
                    - large
                    type: string
                  storage:
                    description: |-
                      Storage carries the filestore mode, which is a per-customer decision:
                      Database mode for a customer with few attachments, a ReadWriteMany claim
                      for one with many.
                    properties:
                      filestore:
                        description: FilestoreSpec says where the filestore lives
                          and admits what cannot be checked.
                        properties:
                          accessModeReadWriteMany:
                            description: |-
                              AccessModeReadWriteMany declares that the volume really is RWX.

                              Declared rather than detected, and the distinction is the honest part: a
                              StorageClass's supported access modes are not reliably knowable from here,
                              and a PVC that binds RWO while claiming RWX fails at scheduling rather than
                              at write time. So the operator requires the claim and refuses more than one
                              replica without it, instead of pretending it verified something.

                              Get it wrong in the optimistic direction and the second pod either never
                              schedules or serves a different filestore from the first.
                            type: boolean
                          claimName:
                            description: |-
                              ClaimName is an existing PVC. Use this when something else manages the
                              volume's lifecycle — which is usually right for staging, because the
                              filestore should outlive the OdooEnvironment object.
                            maxLength: 253
                            type: string
                          mode:
                            default: Ephemeral
                            description: FilestoreMode is where Odoo's filestore lives.
                            enum:
                            - Ephemeral
                            - PersistentVolumeClaim
                            - Database
                            type: string
                          size:
                            description: |-
                              Size creates a PVC owned by this environment. It is deleted with it, so a
                              staging built this way loses its attachments when the object is deleted.
                            pattern: ^[0-9]+(Mi|Gi|Ti)$
                            type: string
                          storageClass:
                            description: StorageClass for a created PVC.
                            maxLength: 253
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: a PersistentVolumeClaim filestore needs either
                            claimName (a PVC you manage) or size (one to create)
                          rule: self.mode != 'PersistentVolumeClaim' || has(self.claimName)
                            || has(self.size)
                        - message: claimName is meaningless with mode Ephemeral; the
                            filestore would still be an emptyDir and the claim would
                            go unused, which is worse than an error
                          rule: self.mode != 'Ephemeral' || !has(self.claimName)
                        - message: mode Database keeps attachments in Postgres, so
                            there is no filestore for a claim or a size to describe
                          rule: self.mode != 'Database' || (!has(self.claimName) &&
                            !has(self.size))
                    type: object
                type: object
              maxEphemeralEnvironments:
                default: 3
                description: |-
                  MaxEphemeralEnvironments caps how many throwaway environments may exist
                  for this customer at once. The validating admission webhook refuses the
                  create that would exceed it.

                  A quota, not a limit for its own sake: if support opens an environment per
                  ticket the cluster dies on Friday. It lives on the tenant rather than
                  globally so a demanding customer cannot starve the others.

                  Zero is a real answer, and it means zero: a customer whose data nobody may
                  copy any more. Which is why this is a pointer — with a plain int32 and
                  `omitempty`, a Go client asking for zero would drop the field on the wire
                  and get the default of 3 instead, silently granting what it tried to deny.
                format: int32
                minimum: 0
                type: integer
              odooVersion:
                description: |-
                  OdooVersion the customer runs, for example "19.0". Recorded here because
                  the version matrix — who is on what — is the question consultancy work
                  asks most often, and nowhere else answers it.
                pattern: ^[0-9]+\.[0-9]+$
                type: string
              productRelease:
                description: |-
                  ProductRelease is the OdooRelease of your own product this customer is on,
                  when there is a product. Empty means a pure bespoke project.

                  Declaring the release rather than copying the product's code is the whole
                  difference between being able to ship a new product version to thirty
                  customers and maintaining thirty forks.
                type: string
            required:
            - displayName
            type: object
          status:
            description: OdooTenantStatus is written by the controller only.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              databases:
                description: Databases is how many OdooDatabase objects declare this
                  tenant.
                format: int32
                type: integer
              environmentMilliHours:
                description: |-
                  EnvironmentHours is a MONOTONIC total of sized environment-hours consumed.

                  Monotonic, and persisted here rather than derived from metrics, because the
                  distinction is what makes it usable at all: a gauge of what is open answers
                  "what is running", and an invoice needs "what was consumed". A counter that
                  resets when the operator redeploys cannot be invoiced from, and a Prometheus
                  retention window is not an accounting record.

                  Sized, not raw: weighted by the size class already declared on each
                  environment, because an hour of `large` costs the platform about three times
                  an hour of `medium` and a meter that ignores that loses money on exactly the
                  customers who use the product most.

                  Stored in milli-hours as an integer. Floats accumulate error over thousands
                  of additions and this value is only ever added to.
                format: int64
                type: integer
              ephemeralEnvironments:
                description: EphemeralEnvironments currently open, for the quota.
                format: int32
                type: integer
              lastAccountedAt:
                description: |-
                  LastAccountedAt is the watermark: consumption before it is already counted in
                  EnvironmentMilliHours.

                  It is what makes the counter survive a restart without double counting, and
                  it bounds the known undercount — see the controller. Accounting that is
                  approximately right and says so beats accounting that is exactly wrong.
                format: date-time
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              sharedDatabases:
                description: |-
                  SharedDatabases is how many of those are Shared with other customers.

                  Surfaced on purpose. It is not an error and it is not nothing: it is the
                  number that tells you how much of this customer's data cannot be handed
                  back to them without subsetting.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
