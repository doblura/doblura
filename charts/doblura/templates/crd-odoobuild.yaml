# Do NOT edit by hand: `make chart-sync` regenerates it.
#
# It lives in templates/ rather than crds/ on purpose: the ones in crds/ are
# only installed the first time and `helm upgrade` never updates them.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: odoobuilds.doblura.dev
  annotations:
    # keep: a `helm uninstall` must NOT take everyone's Doblura objects down
    # with it. Deleting a CRD deletes every object of that kind.
    helm.sh/resource-policy: keep
spec:
  group: doblura.dev
  names:
    kind: OdooBuild
    listKind: OdooBuildList
    plural: odoobuilds
    shortNames:
    - obuild
    singular: odoobuild
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.image
      name: Image
      type: string
    - jsonPath: .status.builtAt
      name: Built
      type: date
    - jsonPath: .spec.from
      name: From
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "OdooBuild turns a set of repositories into an image.\n\nThis
          is the piece decision 6 names, and the collision it resolves is worth\nstating
          at the top of the file: building means seeing the customer's SOURCE. A\ncontrol
          plane that sees only metadata cannot build, so **builds run in the\ncustomer's
          own cluster** and what leaves it is \"build 12 succeeded, image\nsha256:…\".
          If a build ever runs on hardware doblura hosts, the metadata\nboundary of
          decision 2 is gone and nobody announced it.\n\nIt is not the same thing
          as spec.addons.repos, and the difference is worth\nknowing before choosing:\n\n\taddons.repos
          \ clones at pod start, into an emptyDir. Nothing to publish, no\n\t              registry,
          no credentials — and every pod pays the clone, every\n\t              start
          can produce a different tree from a moving branch.\n\tOdooBuild     produces
          an artefact with a digest. Slower to make, instant to\n\t              start,
          identical everywhere, and something a rehearsal can be\n\t              repeated
          against a year later.\n\nNo Dockerfile is required from the customer, and
          that is deliberate: doblura\ngenerates it, from the base image plus the
          repositories declared here. A\nDockerfile in the customer's repository is
          a place where the contract the base\nimage guarantees — click-odoo-contrib,
          greenmask, the Postgres client — can be\nquietly broken, and the failure
          appears the day somebody needs a restore."
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OdooBuildSpec is what to build and where to put it.
            properties:
              builderImage:
                default: quay.io/buildah/stable:v1.37
                description: |-
                  Builder is the image that runs the build.

                  Buildah, and unprivileged: measured in a real cluster as uid 1000 with
                  allowPrivilegeEscalation false and every capability dropped except SETUID
                  and SETGID, using vfs storage and chroot isolation. That set is what makes
                  this installable in a cluster with a restricted Pod Security Standard,
                  which is where anybody sensible runs an operator.
                type: string
              forTenant:
                description: |-
                  ForTenant is the customer this image belongs to, so the console can show it
                  on their page and a quota can be attributed.
                type: string
              from:
                description: |-
                  From is the base image every layer is added to.

                  The doblura base image by default, because that is the one whose contract
                  this operator depends on. Any image may be named; the image study is what
                  says whether it can actually be driven.
                minLength: 1
                type: string
              repos:
                description: |-
                  Repos are the repositories whose addons go into the image, in the order
                  given: a later one shadows an earlier one of the same module name, which is
                  how a customer's own fix on top of an OCA module is expressed.

                  USE A COMMIT for anything that has to be reproducible. A branch is resolved
                  at build time and the commit is recorded in the status, so the image can be
                  traced back — but building the same object tomorrow will produce a
                  different image, and nothing will say so at the time.
                items:
                  description: AddonRepo is a git repository of addons, public or
                    private.
                  properties:
                    auth:
                      description: |-
                        Auth authenticates private repos: PAT, username/password, deploy key or
                        GitHub App. Empty means a public repo.

                        The Odoo Enterprise repository is private, so the EE edition necessarily
                        goes through here.
                      properties:
                        secretRef:
                          description: |-
                            SecretRef is the Secret holding the keys the Type requires. It must live
                            in the same namespace as the OdooRehearsal: reading Secrets from other
                            namespaces would turn Doblura into a privilege-escalation vector.
                          minLength: 1
                          type: string
                        type:
                          description: |-
                            Type is the mechanism. Explicit on purpose: see the package comment on
                            why it is not inferred.
                          enum:
                          - Token
                          - BasicAuth
                          - SSHKey
                          - GitHubApp
                          type: string
                        username:
                          description: |-
                            Username overrides the forge's default username. It only applies to
                            Token. Left empty, it is derived from the URL: x-access-token for
                            github.com, oauth2 for gitlab.com.
                          type: string
                      required:
                      - secretRef
                      - type
                      type: object
                    depth:
                      default: 1
                      description: |-
                        Depth is the clone depth. 1 by default: a rehearsal does not need history
                        and cloning all of OCA costs minutes.
                      format: int32
                      minimum: 0
                      type: integer
                    name:
                      description: |-
                        Name identifies the repo and names its directory inside the emptyDir. It
                        must be unique within the same AddonsSpec.
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    paths:
                      description: |-
                        Paths are the subdirectories of the repo that contain addons. Empty means
                        the root, which is the norm for OCA repositories.

                        A repo with addons in per-version subfolders is declared as:
                        paths: ["17.0"]
                      items:
                        type: string
                      type: array
                    ref:
                      default: main
                      description: |-
                        Ref is a branch, a tag or a commit.

                        For a rehearsal, USE A COMMIT. A branch makes the rehearsal
                        non-reproducible: repeating it tomorrow clones different code and the
                        result stops meaning anything.
                      type: string
                    url:
                      description: URL of the repository. HTTPS or SSH.
                      minLength: 1
                      type: string
                  required:
                  - name
                  - url
                  type: object
                minItems: 1
                type: array
              size:
                default: medium
                description: Size is the resource class for the build pod.
                enum:
                - small
                - medium
                - large
                type: string
              to:
                description: To is where the finished image is pushed.
                properties:
                  image:
                    description: 'Image is the repository, with no tag: ghcr.io/acme/erp.'
                    minLength: 1
                    pattern: ^[a-z0-9]([a-z0-9._:/-]*[a-z0-9])?$
                    type: string
                  insecure:
                    description: |-
                      Insecure allows pushing to a registry over plain HTTP.

                      For a registry inside the cluster, which is the ordinary case for somebody
                      trying this out. Off by default: a push over HTTP to anything outside the
                      cluster sends the credential in clear.
                    type: boolean
                  pushSecret:
                    description: |-
                      PushSecret is a Secret of type kubernetes.io/dockerconfigjson with rights to
                      write to that repository.

                      Required. A build that cannot be pushed produces an image that exists only
                      inside a pod that is about to be deleted, and reporting that as a success
                      would be the emptiest kind of green.
                    minLength: 1
                    type: string
                  tag:
                    description: |-
                      Tag is what the image is pushed as. Empty means one derived from the
                      resolved commits, so two builds of the same source land on the same tag and
                      a build of different source cannot overwrite it.

                      A fixed tag is allowed and is a decision: it makes "latest" mean something
                      that changes underneath every environment that pulls it.
                    type: string
                required:
                - image
                - pushSecret
                type: object
            required:
            - from
            - repos
            - to
            type: object
            x-kubernetes-validations:
            - message: a build with no repositories would produce a copy of the base
                image under a different name
              rule: size(self.repos) > 0
          status:
            description: OdooBuildStatus is what came out.
            properties:
              builtAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              image:
                description: |-
                  Image is the full reference INCLUDING THE DIGEST, which is the only form
                  that means anything a year later. A tag is a name somebody can move.
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: BuildPhase summarises where a build is.
                enum:
                - Pending
                - Cloning
                - Building
                - Pushing
                - Succeeded
                - Failed
                type: string
              sources:
                description: |-
                  Sources is what each repository actually resolved to.

                  The reason this exists: a build from a branch is not reproducible, and the
                  only thing that makes it traceable afterwards is a record of the commit it
                  used. Without it, "which code is in this image?" has no answer.
                items:
                  description: BuiltSource is one repository as it was at build time.
                  properties:
                    commit:
                      type: string
                    name:
                      type: string
                    ref:
                      description: Ref is what was asked for, Commit is what that
                        turned out to be.
                      type: string
                    url:
                      type: string
                  required:
                  - commit
                  - name
                  - ref
                  - url
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
