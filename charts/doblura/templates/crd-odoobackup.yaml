                  Environment is what gets backed up, by name in this namespace.

                  The environment rather than a database name, because a backup that does
                  not include the filestore restores to an Odoo full of broken attachments,
                  and only the environment knows where the filestore is.
                minLength: 1
                type: string
              retention:
                description: Retention is how many are kept.
                properties:
                  daily:
                    default: 7
                    format: int32
                    maximum: 90
                    minimum: 0
                    type: integer
                  monthly:
                    default: 3
                    format: int32
                    maximum: 24
                    minimum: 0
                    type: integer
                  weekly:
                    default: 4
                    format: int32
                    maximum: 52
                    minimum: 0
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: 'a retention policy that keeps nothing is a backup schedule
                    that deletes everything it makes: set at least one of daily, weekly
                    or monthly'
