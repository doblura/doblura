                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              copies:
                description: Copies are the backups that currently exist, newest first.
                items:
                  description: BackupCopy is one backup.
                  properties:
                    name:
                      description: Name is the file or object, which is what somebody
                        restoring types.
                      type: string
                    sizeBytes:
                      description: SizeBytes as reported by the destination.
                      format: int64
                      type: integer
                    takenAt:
                      description: TakenAt is when.
                      format: date-time
                      type: string
                    tier:
                      description: |-
                        Tier is which retention rule keeps it: daily, weekly or monthly.

                        Recorded rather than recomputed, because a backup's tier is decided when
                        it is taken and recomputing it later would quietly reclassify — and
