{{- if .Values.crds.install }}
# Generated by controller-gen and copied by hack/sync-chart.py.
# Do NOT edit by hand: `make chart-sync` regenerates it.
#
# It lives in templates/ rather than crds/ on purpose: the ones in crds/ are
# only installed the first time and `helm upgrade` never updates them.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: odoosnapshots.doblura.dev
  annotations:
    # keep: a `helm uninstall` must NOT take everyone's Doblura objects down
    # with it. Deleting a CRD deletes every object of that kind.
    helm.sh/resource-policy: keep
spec:
  group: doblura.dev
  names:
    kind: OdooSnapshot
    listKind: OdooSnapshotList
    plural: odoosnapshots
    shortNames:
    - osnap
    singular: odoosnapshot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - description: Last good dump
      jsonPath: .status.lastSuccessfulTime
      name: Last
      type: date
    - jsonPath: .status.sizeBytes
      name: Size
      type: integer
    - description: Masked columns
      jsonPath: .status.columnsMasked
      name: Masked
      type: integer
    - description: Companies extracted, empty means the whole database
      jsonPath: .spec.subset.companies
      name: Subset
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OdooSnapshot produces an anonymized, neutralized dump of production, ready to
          feed an OdooRehearsal or an OdooEnvironment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OdooSnapshotSpec produce un dump anonimizado listo para un
              doblura.
            properties:
              denyEgress:
                default: true
                description: |-
                  DenyEgress adds a NetworkPolicy stopping the pod from talking to anything
                  other than its Postgres and its destination.

                  true by default: this pod holds a COMPLETE, un-anonymized copy of
                  production for several minutes. It is the most sensitive pod in the whole
                  cluster and it has no reason whatsoever to reach the internet.
                type: boolean
              image:
                description: |-
                  Image is an Odoo image. It is needed to neutralize with the native command
                  and so the schema matches the source's.
                minLength: 1
                type: string
              mask:
                description: MaskSpec says which columns get masked and with what.
                properties:
                  customCommand:
                    items:
                      type: string
                    type: array
                  customImage:
                    description: CustomImage is the image used when Engine is Custom.
                    type: string
                  engine:
                    default: Greenmask
                    description: |-
                      MaskEngine is which tool does the masking.

                      Same principle as the snapshots: generic first. Doblura does not implement an
                      anonymization engine — it orchestrates one that already exists and is proven.
                      Writing fake-data generators is a bottomless pit and it is not the
                      interesting problem.
                    enum:
                    - Greenmask
                    - SQL
                    - Custom
                    type: string
                  maskUserLogins:
                    description: |-
                      MaskUserLogins additionally masks res_users.login.

                      false by default, and deliberately so: change the logins and NOBODY can
                      log in with their usual account to validate the environment by hand. Only
                      turn it on if your logins are personal email addresses, and prepare a
                      technical account with a known login.
                    type: boolean
                  preset:
                    default: true
                    description: |-
                      Preset applies the personal-data ruleset of a standard Odoo: contacts,
                      chatter, bank accounts, employees and CRM.
                    type: boolean
                  resetPasswords:
                    default: true
                    description: |-
                      ResetPasswords assigns the same known password to every user.

                      true by default: leaving production password hashes in place is a leak,
                      and randomizing them leaves an environment nobody can log into, which is
                      the same problem by another route.

                      For a publicly exposed environment this is not enough — see
                      OdooEnvironment.security.randomizeUserPasswords.
                    type: boolean
                  rules:
                    description: |-
                      Rules add to or override the preset. A rule on the same table+column
                      replaces the preset's.
                    items:
                      description: MaskRule masks one column.
                      properties:
                        column:
                          minLength: 1
                          type: string
                        kind:
                          description: MaskKind is the class of fake data to generate.
                          enum:
                          - Name
                          - FirstName
                          - LastName
                          - Email
                          - Phone
                          - Address
                          - City
                          - Zip
                          - VAT
                          - IBAN
                          - URL
                          - Text
                          - "Null"
                          - Fixed
                          - Hash
                          type: string
                        table:
                          minLength: 1
                          type: string
                        value:
                          description: Value is the constant used when Kind is Fixed.
                          type: string
                      required:
                      - column
                      - kind
                      - table
                      type: object
                    type: array
                type: object
              neutralize:
                default: true
                description: |-
                  Neutralize cuts outgoing mail, crons, payment providers and carriers.

                  true by default, and here there is NO way to turn it off. OdooRehearsal
                  has the acknowledgement escape hatch because you sometimes rehearse
                  against data that was neutralized earlier. Here we are producing the
                  artifact others will consume: if it leaves un-neutralized, the damage
                  propagates to every environment that uses it.
                type: boolean
              schedule:
                description: |-
                  Schedule in cron format. When set, a CronJob is created; otherwise it runs
                  once.

                  Weekly is the sensible cadence: a week-old dump is perfectly fine for
                  rehearsing a migration, and daily is load for nothing.
                pattern: ^(@(hourly|daily|weekly|monthly)|([-0-9*/,]+\s+){4}[-0-9*/,]+)$
                type: string
              size:
                default: medium
                description: |-
                  Size expresses intent, not resources. The translation to cpu/memory lives in
                  the platform (internal/controller/sizes.go) and can change without anyone
                  editing their manifests.
                enum:
                - small
                - medium
                - large
                type: string
              source:
                description: Source is what gets copied.
                properties:
                  acknowledgeProductionRead:
                    description: |-
                      AcknowledgeProductionRead must be exactly
                      "i-accept-reading-from-production-and-the-load-it-causes" when Live is
                      true.
                    type: string
                  host:
                    minLength: 1
                    type: string
                  live:
                    description: |-
                      Live declares that Host points at the live PRODUCTION database, not a
                      replica and not a backup.

                      A pg_dump is read-only and corrupts nothing, but it evicts the page cache
                      and competes for I/O for the whole duration of the dump. On a large
                      database that is noticeable in production.

                      Preference, in order: an existing backup, a read replica, and only if
                      there is no alternative, production with this flag and inside a window.
                    type: boolean
                  name:
                    description: Name is the source database.
                    minLength: 1
                    type: string
                  passwordSecret:
                    minLength: 1
                    type: string
                  port:
                    default: 5432
                    format: int32
                    type: integer
                  user:
                    minLength: 1
                    type: string
                required:
                - host
                - name
                - passwordSecret
                - user
                type: object
                x-kubernetes-validations:
                - message: reading from the live production database requires acknowledgeProductionRead
                    set to its literal value; use a replica or an existing backup
                    if you can
                  rule: '!has(self.live) || self.live == false || self.acknowledgeProductionRead
                    == ''i-accept-reading-from-production-and-the-load-it-causes'''
              subset:
                description: |-
                  Subset extracts only the declared companies. Omit it to dump everything,
                  which is correct for a single-tenant database and wrong for a shared one.
                properties:
                  acknowledgeSharedMasterData:
                    description: |-
                      AcknowledgeSharedMasterData must be
                      "i-accept-odoo-shares-master-data-between-companies"
                      to confirm you have read the caveat above: a subset is not a clean
                      separation, because contacts, products and users are shared by design.

                      It is required rather than advisory for the same reason the neutralize
                      acknowledgement is: this is the failure mode where somebody believes the
                      tool did something it cannot do.
                    minLength: 1
                    type: string
                  companies:
                    description: |-
                      Companies are the res.company names to keep. Everything not reachable from
                      them is dropped.
                    items:
                      type: string
                    maxItems: 64
                    minItems: 1
                    type: array
                  keepGlobal:
                    default:
                    - ir_model
                    - ir_model_fields
                    - ir_model_data
                    - ir_module_module
                    - ir_ui_view
                    - ir_config_parameter
                    - res_groups
                    - res_lang
                    - res_currency
                    - res_country
                    description: |-
                      KeepGlobal are tables exported in full regardless of company, because they
                      are configuration rather than data and a subset without them produces a
                      database Odoo cannot start.

                      The defaults are the registry and the access rights: strip those and the ORM
                      has nothing to boot from. They are a default rather than hardcoded because
                      your addons may add tables with the same character.
                    items:
                      type: string
                    type: array
                required:
                - acknowledgeSharedMasterData
                - companies
                type: object
                x-kubernetes-validations:
                - message: 'subsetting requires acknowledgeSharedMasterData set to
                    its literal value: Odoo shares master data (contacts, products,
                    users) between companies by design, so a per-company subset is
                    handoverable but not a clean separation'
                  rule: self.acknowledgeSharedMasterData == 'i-accept-odoo-shares-master-data-between-companies'
              to:
                description: To is where the result is left.
                properties:
                  custom:
                    description: |-
                      CustomProvider runs your container to fetch the dump.

                      The contract, in full:

                       1. Leave the dump at /snapshot (the SnapshotMountPath constant).
                       2. Exit 0 on success.

                      Nothing else. Doblura does not inspect how you got it. A backup on NFS, in
                      Bacula, behind a proprietary API, a pg_dump against a live replica: if it
                      honours the contract it works exactly like the built-in providers.
                    properties:
                      args:
                        items:
                          type: string
                        type: array
                      command:
                        items:
                          type: string
                        type: array
                      env:
                        additionalProperties:
                          type: string
                        description: Env holds literal variables. For secrets, use
                          EnvFromSecrets.
                        type: object
                      envFromSecrets:
                        description: EnvFromSecrets projects whole Secrets as environment
                          variables.
                        items:
                          type: string
                        type: array
                      extraVolumeClaims:
                        description: |-
                          ExtraVolumeClaims mounts additional PVCs, read-only, under
                          /mnt/<claimName>. For when the source is another volume in the cluster.
                        items:
                          type: string
                        type: array
                      image:
                        minLength: 1
                        type: string
                    required:
                    - image
                    type: object
                  objectStore:
                    description: |-
                      ObjectStoreProvider downloads from any S3-compatible store.

                      Deliberately generic. AWS, MinIO, Ceph RGW, Cloudflare R2, Wasabi, Backblaze
                      B2 and DigitalOcean Spaces all speak the same protocol: a type per cloud
                      would duplicate the same code five times and still fall short on the sixth.
                    properties:
                      bucket:
                        minLength: 1
                        type: string
                      credentialsSecret:
                        description: |-
                          CredentialsSecret holds the accessKeyID and secretAccessKey keys. Leaving
                          it empty means credentials from the environment, which is what you want
                          with IRSA on EKS or Workload Identity, where there are no keys to store.
                        type: string
                      endpoint:
                        description: |-
                          Endpoint for anything that is not AWS. Empty means AWS.
                          Examples: https://minio.svc:9000, https://<id>.r2.cloudflarestorage.com
                        type: string
                      forcePathStyle:
                        description: |-
                          ForcePathStyle is required by MinIO and almost everything self-hosted,
                          where the bucket goes in the path rather than the subdomain.
                        type: boolean
                      key:
                        description: Key is the object, or the prefix when the dump
                          is several files.
                        minLength: 1
                        type: string
                      region:
                        default: us-east-1
                        type: string
                    required:
                    - bucket
                    - key
                    type: object
                  type:
                    description: SnapshotProviderType is where the bytes come from.
                    enum:
                    - Volume
                    - ObjectStore
                    - HTTP
                    - Custom
                    type: string
                  volume:
                    description: VolumeProvider mounts a PVC that already holds the
                      dump.
                    properties:
                      claimName:
                        minLength: 1
                        type: string
                      subPath:
                        default: prod-anon
                        description: SubPath is the path inside the volume where the
                          dump lives.
                        type: string
                    required:
                    - claimName
                    type: object
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: type Volume requires the volume field
                  rule: self.type != 'Volume' || has(self.volume)
                - message: type ObjectStore requires the objectStore field
                  rule: self.type != 'ObjectStore' || has(self.objectStore)
                - message: type Custom requires the custom field
                  rule: self.type != 'Custom' || has(self.custom)
              truncate:
                description: |-
                  TruncateSpec says which tables get emptied.

                  DISABLED BY DEFAULT, and that is the single most important design decision in
                  this type.

                  The point of anonymizing is to lose sensitive information, NOT to lose rows.
                  Those are different things, and conflating them ruins what the copy is for:

                    - Masking keeps every row, the volume, the relations and the distributions,
                      and destroys the personal content. Full fidelity.
                    - Truncating destroys rows. And with them, exactly what you wanted to
                      measure: mail_message is one of the slowest tables to migrate, so a
                      rehearsal with an empty chatter gives you a duration that is not the real
                      one. And a test environment with no message history is useless for anyone
                      trying to test anything.

                  Truncating is an optimization paid for in fidelity. Sometimes it is worth it
                  — a 200 GB database on a 32 GB homelab — but it is a conscious decision, not a
                  default. Turn it on and the result no longer predicts the real duration.
                properties:
                  extra:
                    description: Extra adds tables to the list.
                    items:
                      type: string
                    type: array
                  keep:
                    description: Keep removes tables from the preset list, if you
                      need one of them.
                    items:
                      type: string
                    type: array
                  preset:
                    default: false
                    description: |-
                      Preset applies the volume-table list of a standard Odoo: chatter,
                      notifications, bus, logs, audit trails and job queues.

                      It is implemented with `--exclude-table-data`, which keeps the table, the
                      schema, the indexes and the constraints and omits only the rows. NOT with
                      `--exclude-table`, which removes the whole table and leaves a schema
                      Odoo's ORM does not recognise. That distinction is what makes this
                      possible at all.

                      false by default: see the type comment. What you want to lose is sensitive
                      data, not rows.
                    type: boolean
                type: object
              work:
                description: Work is where the intermediate database is created.
                properties:
                  host:
                    minLength: 1
                    type: string
                  passwordSecret:
                    minLength: 1
                    type: string
                  port:
                    default: 5432
                    format: int32
                    type: integer
                  user:
                    minLength: 1
                    type: string
                required:
                - host
                - passwordSecret
                - user
                type: object
            required:
            - image
            - source
            - to
            - work
            type: object
          status:
            description: OdooSnapshotStatus is written by the controller only.
            properties:
              columnsMasked:
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSuccessfulTime:
                description: |-
                  LastSuccessfulTime is when the last good dump was produced. It is the
                  operational number: a three-month-old dump makes every rehearsal lie, and
                  this is what gives it away.
                format: date-time
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: SnapshotPhase summarises the state.
                enum:
                - Pending
                - Copying
                - Neutralizing
                - Anonymizing
                - Dumping
                - Uploading
                - Succeeded
                - Failed
                type: string
              sizeBytes:
                description: |-
                  SizeBytes of the resulting dump. Compared against production's size it
                  tells you whether truncation actually did anything.
                format: int64
                type: integer
              tablesTruncated:
                description: |-
                  TablesTruncated and ColumnsMasked are the effective counts. They serve as
                  evidence of diligence: how many personal-data columns were actually
                  handled in this particular dump.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
