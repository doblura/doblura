                  InstanceRef is the OdooInstance this database lives on. Empty means the
                  database is not placed yet and the placer will choose.
                type: string
              name:
                description: Name is the database name on the server.
                minLength: 1
                type: string
              role:
                description: |-
                  Role is what the database is for. It decides which instance tiers may
                  host it.
                enum:
                - Production
                - Staging
                - QA
                - Review
                - Rehearsal
                - Development
                type: string
              sizeGi:
                description: SizeGi is the approximate size, used by placement to
                  reserve headroom.
                format: int32
                type: integer
              tenancy:
                default: SingleTenant
                description: |-
                  Tenancy declares who is inside. Read the type comment before choosing
                  Shared.
                enum:
                - SingleTenant
                - RelatedCompanies
                - Shared
                type: string
            required:
            - name
            - role
            type: object
            x-kubernetes-validations:
            - message: tenancy SingleTenant cannot list more than one company; use
                RelatedCompanies if they belong to the same customer, or Shared if
                they do not
              rule: self.tenancy != 'SingleTenant' || !has(self.companies) || size(self.companies)
                <= 1
            - message: tenancy RelatedCompanies requires every company to belong to
                the SAME tenant; if the tenants differ this database is Shared
              rule: self.tenancy != 'RelatedCompanies' || !has(self.companies) ||
                self.companies.all(c, c.tenantRef == self.companies[0].tenantRef)
            - message: tenancy Shared means unrelated customers in one database, so
                it must list at least two companies
