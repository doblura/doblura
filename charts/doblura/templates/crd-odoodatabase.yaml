                    company:
                      description: Company is the res.company name as it appears in
                        the database.
                      maxLength: 128
                      minLength: 1
                      type: string
                    tenantRef:
                      description: TenantRef is the OdooTenant that owns this company.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - company
                  - tenantRef
                  type: object
                maxItems: 64
                type: array
              instanceRef:
