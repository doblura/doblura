{{- if .Values.defaults }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "doblura.fullname" . }}-defaults
  namespace: {{ .Release.Namespace }}
  labels: {{- include "doblura.labels" . | nindent 4 }}
data:
  # Images of the auxiliary containers, mirrored here for somebody looking at the
  # cluster. What the manager actually READS is the environment on its Deployment,
  # set from the same values — see the comment there. This ConfigMap on its own
  # changed nothing for as long as it existed, which is why the two are now
  # written from one place and why this comment says which is which.
  {{- range $k, $v := .Values.defaults }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
