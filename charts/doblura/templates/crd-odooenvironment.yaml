{{- if .Values.crds.install }}
# Generated by controller-gen and copied by hack/sync-chart.py.
# Do NOT edit by hand: `make chart-sync` regenerates it.
#
# It lives in templates/ rather than crds/ on purpose: the ones in crds/ are
# only installed the first time and `helm upgrade` never updates them.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: odooenvironments.doblura.dev
  annotations:
    # keep: a `helm uninstall` must NOT take everyone's Doblura objects down
    # with it. Deleting a CRD deletes every object of that kind.
    helm.sh/resource-policy: keep
spec:
  group: doblura.dev
  names:
    kind: OdooEnvironment
    listKind: OdooEnvironmentList
    plural: odooenvironments
    shortNames:
    - oenv
    singular: odooenvironment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.data.type
      name: Data
      type: string
    - jsonPath: .spec.lifecycle.type
      name: Lifecycle
      type: string
    - jsonPath: .spec.exposure.public
      name: Public
      type: boolean
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OdooEnvironment brings up an Odoo with a declared data source and lifecycle,
          and with the security posture its exposure demands.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OdooEnvironmentSpec brings up an Odoo.

              The three rules that encode "the same security as production" for a public
              environment holding real data:

              The two combinations that silently lose data, refused at apply time rather than
              discovered when somebody opens an invoice:

                - a Persistent or Hibernating environment with an ephemeral filestore. The
                  database survives the pod and the files do not, so ir_attachment keeps rows
                  pointing at store_fname paths that are gone.

                  Note the predicate is lifecycle.type, NOT the absence of a ttl. The first
                  version of this rule tested "no lifecycle.ttl" and never fired, because ttl
                  carries a 72h default and the API server fills it in — so at CEL evaluation
                  time every environment has one. Caught by the guardrail check that expected
                  a rejection and got an accept.

                - more than one web replica without a filestore that is really ReadWriteMany.
                  Each pod would serve its own copy.

              Both guard with has() first. self.lifecycle on an object that omitted it is an
              evaluation ERROR, not a missing value, and an erroring rule rejects every
              OdooEnvironment including the valid ones — the trap this project has now hit
              four times.
            properties:
              addons:
                description: |-
                  AddonsSpec says where the addons come from.

                  Everything can be combined: some baked, some cloned, some on a volume. The
                  operator composes the resulting addons path.
                properties:
                  baked:
                    description: |-
                      Baked lists addon paths that ALREADY ship inside the image. They are read
                      where they are: not copied, not moved, not mounted.

                      Example: ["/opt/odoo/addons-custom", "/opt/odoo/addons-oca"]
                    items:
                      type: string
                    type: array
                  edition:
                    default: Community
                    description: |-
                      Edition is Community or Enterprise. It does not change the operator's
                      behaviour, but it does change validation and what gets recorded in the
                      status: knowing which edition a migration was rehearsed against matters
                      when something breaks six months later.
                    enum:
                    - Community
                    - Enterprise
                    type: string
                  precedence:
                    default: ExternalFirst
                    description: |-
                      AddonsPrecedence decides who wins when the same module appears in more than
                      one source. In Odoo the first entry on the addons path wins, which is why
                      this has to be explicit: the alternative is loading different code than you
                      think, and that is exactly the class of failure Doblura exists to catch.
                    enum:
                    - ExternalFirst
                    - BakedFirst
                    type: string
                  repos:
                    description: |-
                      Repos are cloned by an init container into an ephemeral emptyDir. Every
                      pod starts with the volume empty, so no mixture of versions is possible.
                    items:
                      description: AddonRepo is a git repository of addons, public
                        or private.
                      properties:
                        auth:
                          description: |-
                            Auth authenticates private repos: PAT, username/password, deploy key or
                            GitHub App. Empty means a public repo.

                            The Odoo Enterprise repository is private, so the EE edition necessarily
                            goes through here.
                          properties:
                            secretRef:
                              description: |-
                                SecretRef is the Secret holding the keys the Type requires. It must live
                                in the same namespace as the OdooRehearsal: reading Secrets from other
                                namespaces would turn Doblura into a privilege-escalation vector.
                              minLength: 1
                              type: string
                            type:
                              description: |-
                                Type is the mechanism. Explicit on purpose: see the package comment on
                                why it is not inferred.
                              enum:
                              - Token
                              - BasicAuth
                              - SSHKey
                              - GitHubApp
                              type: string
                            username:
                              description: |-
                                Username overrides the forge's default username. It only applies to
                                Token. Left empty, it is derived from the URL: x-access-token for
                                github.com, oauth2 for gitlab.com.
                              type: string
                          required:
                          - secretRef
                          - type
                          type: object
                        depth:
                          default: 1
                          description: |-
                            Depth is the clone depth. 1 by default: a rehearsal does not need history
                            and cloning all of OCA costs minutes.
                          format: int32
                          minimum: 0
                          type: integer
                        name:
                          description: |-
                            Name identifies the repo and names its directory inside the emptyDir. It
                            must be unique within the same AddonsSpec.
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        paths:
                          description: |-
                            Paths are the subdirectories of the repo that contain addons. Empty means
                            the root, which is the norm for OCA repositories.

                            A repo with addons in per-version subfolders is declared as:
                            paths: ["17.0"]
                          items:
                            type: string
                          type: array
                        ref:
                          default: main
                          description: |-
                            Ref is a branch, a tag or a commit.

                            For a rehearsal, USE A COMMIT. A branch makes the rehearsal
                            non-reproducible: repeating it tomorrow clones different code and the
                            result stops meaning anything.
                          type: string
                        url:
                          description: URL of the repository. HTTPS or SSH.
                          minLength: 1
                          type: string
                      required:
                      - name
                      - url
                      type: object
                    type: array
                  volume:
                    description: |-
                      Volume is a PVC already populated by another process. It is mounted
                      ReadOnly, so a rehearsal cannot corrupt what others share.
                    properties:
                      claimName:
                        minLength: 1
                        type: string
                      paths:
                        default:
                        - /addons
                        description: Paths are the paths inside the volume that contain
                          addons.
                        items:
                          type: string
                        type: array
                    required:
                    - claimName
                    type: object
                type: object
                x-kubernetes-validations:
                - message: 'edition Enterprise needs at least one addons source: the
                    enterprise modules do not ship in the community image'
                  rule: self.edition != 'Enterprise' || size(self.baked) > 0 || size(self.repos)
                    > 0 || has(self.volume)
              data:
                description: EnvData is the data source.
                properties:
                  acknowledgeReidentificationRisk:
                    description: |-
                      AcknowledgeReidentificationRisk is required to combine snapshot data with
                      public access.

                      Anonymizing is not magic. Deterministic masking deliberately preserves
                      relations, distributions and dates, because without those the environment
                      is useless for testing. That is precisely what allows re-identification:
                      anyone who knows an order total, a specific date or an unusual product can
                      tie the record back to its person.

                      It is a residual risk that is acceptable in many cases, but it is a
                      decision somebody has to make by hand, not a default.
                    type: string
                  snapshot:
                    description: |-
                      Snapshot is what gets restored when Type is Snapshot. Same generic
                      provider model as OdooRehearsal.
                    properties:
                      format:
                        default: OdooBackup
                        description: Format is how the dump is packaged.
                        enum:
                        - OdooBackup
                        - PgDump
                        - PgPlain
                        type: string
                      from:
                        description: From is the provider.
                        properties:
                          custom:
                            description: |-
                              CustomProvider runs your container to fetch the dump.

                              The contract, in full:

                               1. Leave the dump at /snapshot (the SnapshotMountPath constant).
                               2. Exit 0 on success.

                              Nothing else. Doblura does not inspect how you got it. A backup on NFS, in
                              Bacula, behind a proprietary API, a pg_dump against a live replica: if it
                              honours the contract it works exactly like the built-in providers.
                            properties:
                              args:
                                items:
                                  type: string
                                type: array
                              command:
                                items:
                                  type: string
                                type: array
                              env:
                                additionalProperties:
                                  type: string
                                description: Env holds literal variables. For secrets,
                                  use EnvFromSecrets.
                                type: object
                              envFromSecrets:
                                description: EnvFromSecrets projects whole Secrets
                                  as environment variables.
                                items:
                                  type: string
                                type: array
                              extraVolumeClaims:
                                description: |-
                                  ExtraVolumeClaims mounts additional PVCs, read-only, under
                                  /mnt/<claimName>. For when the source is another volume in the cluster.
                                items:
                                  type: string
                                type: array
                              image:
                                minLength: 1
                                type: string
                            required:
                            - image
                            type: object
                          http:
                            description: HTTPProvider downloads the dump from a URL.
                            properties:
                              authSecret:
                                description: |-
                                  AuthSecret holds "username" and "password" for basic auth, or "bearer"
                                  for a token.
                                type: string
                              url:
                                minLength: 1
                                pattern: ^https?://
                                type: string
                            required:
                            - url
                            type: object
                          objectStore:
                            description: |-
                              ObjectStoreProvider downloads from any S3-compatible store.

                              Deliberately generic. AWS, MinIO, Ceph RGW, Cloudflare R2, Wasabi, Backblaze
                              B2 and DigitalOcean Spaces all speak the same protocol: a type per cloud
                              would duplicate the same code five times and still fall short on the sixth.
                            properties:
                              bucket:
                                minLength: 1
                                type: string
                              credentialsSecret:
                                description: |-
                                  CredentialsSecret holds the accessKeyID and secretAccessKey keys. Leaving
                                  it empty means credentials from the environment, which is what you want
                                  with IRSA on EKS or Workload Identity, where there are no keys to store.
                                type: string
                              endpoint:
                                description: |-
                                  Endpoint for anything that is not AWS. Empty means AWS.
                                  Examples: https://minio.svc:9000, https://<id>.r2.cloudflarestorage.com
                                type: string
                              forcePathStyle:
                                description: |-
                                  ForcePathStyle is required by MinIO and almost everything self-hosted,
                                  where the bucket goes in the path rather than the subdomain.
                                type: boolean
                              key:
                                description: Key is the object, or the prefix when
                                  the dump is several files.
                                minLength: 1
                                type: string
                              region:
                                default: us-east-1
                                type: string
                            required:
                            - bucket
                            - key
                            type: object
                          type:
                            description: SnapshotProviderType is where the bytes come
                              from.
                            enum:
                            - Volume
                            - ObjectStore
                            - HTTP
                            - Custom
                            type: string
                          volume:
                            description: VolumeProvider mounts a PVC that already
                              holds the dump.
                            properties:
                              claimName:
                                minLength: 1
                                type: string
                              subPath:
                                default: prod-anon
                                description: SubPath is the path inside the volume
                                  where the dump lives.
                                type: string
                            required:
                            - claimName
                            type: object
                        required:
                        - type
                        type: object
                        x-kubernetes-validations:
                        - message: type Volume requires the volume field
                          rule: self.type != 'Volume' || has(self.volume)
                        - message: type ObjectStore requires the objectStore field
                          rule: self.type != 'ObjectStore' || has(self.objectStore)
                        - message: type HTTP requires the http field
                          rule: self.type != 'HTTP' || has(self.http)
                        - message: type Custom requires the custom field
                          rule: self.type != 'Custom' || has(self.custom)
                      neutralize:
                        default: true
                        description: |-
                          Neutralize disables scheduled actions, outgoing mail servers, payment
                          providers and delivery carriers after restoring.

                          It defaults to true, and for good reason: a production dump restored with
                          network access and no neutralization sends real invoices to real
                          customers. It is the most expensive failure in this domain and
                          documentation does not prevent it, so the default covers it and disabling
                          it takes effort.

                          Note: neutralizing is NOT anonymizing. This cuts the outbound paths; the
                          personal data is still there.
                        type: boolean
                      unsafeAcknowledgement:
                        description: |-
                          UnsafeAcknowledgement must be exactly
                          "i-accept-this-can-send-real-emails-and-charge-real-cards"
                          for neutralize: false to be accepted.
                        type: string
                    required:
                    - from
                    type: object
                    x-kubernetes-validations:
                    - message: disabling neutralize requires unsafeAcknowledgement
                        set to its literal value, because an un-neutralized production
                        dump sends real emails and charges real cards
                      rule: (!has(self.neutralize) || self.neutralize) || self.unsafeAcknowledgement
                        == 'i-accept-this-can-send-real-emails-and-charge-real-cards'
                  type:
                    description: EnvDataType is where the environment's data comes
                      from.
                    enum:
                    - Empty
                    - Demo
                    - Snapshot
                    - Live
                    type: string
                required:
                - type
                type: object
              database:
                description: DatabaseSpec is where to create the rehearsal's scratch
                  database.
                properties:
                  host:
                    description: Host of the Postgres server.
                    minLength: 1
                    type: string
                  passwordSecret:
                    description: PasswordSecret is the Secret holding the "password"
                      key.
                    minLength: 1
                    type: string
                  port:
                    default: 5432
                    format: int32
                    type: integer
                  proxy:
                    description: Proxy puts a connection pooler between Odoo and this
                      server.
                    properties:
                      defaultPoolSize:
                        format: int32
                        minimum: 1
                        type: integer
                      image:
                        description: Image is the pooler. pgbouncer is what the generated
                          configuration speaks.
                        minLength: 1
                        type: string
                      maxClientConn:
                        format: int32
                        minimum: 1
                        type: integer
                      mode:
                        default: None
                        description: DatabaseProxyMode selects the proxy topology.
                        enum:
                        - None
                        - Sidecar
                        type: string
                      poolMode:
                        default: Session
                        description: |-
                          PoolMode defaults to Session, and that default is the whole point.

                          Session is the only mode that keeps a client on one server connection for
                          the life of the connection, and Odoo needs that: bus.py issues
                          `listen imbus` and then waits on the socket. Transaction pooling returns
                          the server connection to the pool the moment the transaction ends, so the
                          registration is on a backend the listener no longer holds.

                          Everything else Odoo does is transaction-scoped and would be fine —
                          ir_cron serialises with FOR NO KEY UPDATE SKIP LOCKED, mail_thread uses
                          pg_try_advisory_xact_lock. The bus is the one exception, and it is enough.
                        enum:
                        - Session
                        - Transaction
                        type: string
                      unsafeAcknowledgement:
                        description: UnsafeAcknowledgement gates Transaction. See
                          the CEL message.
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: 'proxy mode Sidecar needs an explicit image: there
                        is no sensible default, because the pooler image is the one
                        container in the pod that will hold your database credential
                        and pinning a vendor tag on your behalf is not a decision
                        this operator should make for you'
                      rule: self.mode != 'Sidecar' || has(self.image)
                    - message: 'poolMode Transaction requires unsafeAcknowledgement
                        set to its literal value: Odoo''s bus registers with LISTEN,
                        which is session state, and transaction pooling does not preserve
                        it: the failure is that live notifications silently stop,
                        and it appears under concurrency rather than in testing'
                      rule: self.poolMode != 'Transaction' || (has(self.unsafeAcknowledgement)
                        && self.unsafeAcknowledgement == 'i-accept-transaction-pooling-breaks-the-odoo-bus')
                  user:
                    minLength: 1
                    type: string
                required:
                - host
                - passwordSecret
                - user
                type: object
              exposure:
                default: {}
                description: |-
                  EnvExposure describes how the environment is reached.

                  The rules encode "the same security as production". They are not advice: the
                  API server enforces them at apply time.
                properties:
                  allowFrom:
                    description: |-
                      AllowFrom restricts who may reach it at all, as CIDR blocks.

                      Before authentication rather than instead of it. A password in front of a
                      staging environment stops somebody who finds the address; a network
                      restriction stops them reaching the application at all, which also means
                      they cannot reach whatever is unpatched in it this week.

                      Empty means anywhere, which is the honest default: doblura does not know
                      the customer's networks, and a made-up range would lock out the people who
                      need it while reading as a protection.
                    items:
                      type: string
                    type: array
                  auth:
                    default: {}
                    description: EnvAuth is the ingress authentication.
                    properties:
                      forwardURL:
                        description: ForwardURL is the authentication service, for
                          ForwardAuth.
                        type: string
                      secretRef:
                        description: |-
                          SecretRef holds "users" (htpasswd format) for BasicAuth, or "url" of the
                          authentication service for ForwardAuth.

                          Optional for BasicAuth: left empty, doblura generates one. It was optional
                          before too, and a public environment with BasicAuth and no secret produced
                          a middleware pointing at a Secret that did not exist — which fails open or
                          closed depending on the version, and neither belongs in front of a
                          customer's data.
                        type: string
                      type:
                        default: BasicAuth
                        description: EnvAuthType is who can reach the environment.
                        enum:
                        - None
                        - BasicAuth
                        - ForwardAuth
                        type: string
                    type: object
                  host:
                    description: |-
                      Host is the address it answers on.

                      Left empty, it is generated from the customer's domain — see
                      OdooTenantSpec.Domain — except for Production, which is never generated.
                      Written into the spec at admission rather than resolved at reconcile time,
                      so it is the same address for the life of the environment: a hostname
                      recomputed on every reconcile is a hostname that changes under a running
                      certificate.
                    maxLength: 253
                    type: string
                  hsts:
                    description: |-
                      HSTS tells browsers to refuse http for this host for a year.

                      Defaults to on for a public environment and off otherwise. It is worth
                      knowing that this is remembered by the browser and cannot be taken back
                      within the year: it is set for the host only, never for subdomains and
                      never with preload, because environments live on generated names under a
                      customer's domain and a claim over the whole domain from one of them would
                      reach names doblura did not create and cannot fix.
                    type: boolean
                  noIndex:
                    default: true
                    description: |-
                      NoIndex adds X-Robots-Tag to the ingress.

                      true by default: a test environment holding realistic-looking data indexed
                      by Google is a leak that requires nobody to attack anything.
                    type: boolean
                  public:
                    description: |-
                      Public declares that the environment is reachable from the internet.

                      Turning it on switches on a set of requirements: mandatory
                      authentication, randomized passwords, closed egress and noindex. It is a
                      security-posture switch, not just a networking one.
                    type: boolean
                  rateLimitRPS:
                    default: 20
                    description: |-
                      RateLimitRPS limits requests per second at the ingress. A public Odoo with
                      no limit falls over on its own the moment a rude crawler shows up.
                    format: int32
                    type: integer
                  waf:
                    description: WAF inspects requests before Odoo sees them.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: Annotations go on the Ingress for Provider mode,
                          verbatim.
                        type: object
                      blockDatabaseManager:
                        default: true
                        description: |-
                          BlockDatabaseManager refuses /web/database/*, which creates, drops,
                          backs up and restores databases.

                          On by default. Odoo's own list_db = False already hides it and doblura sets
                          that, so this is the second lock rather than the first — and it is the lock
                          that still holds if somebody edits the configuration, restores a dump with
                          its own odoo.conf, or runs an image that ships different defaults.
                        type: boolean
                      blockRPC:
                        description: |-
                          BlockRPC refuses /jsonrpc and /xmlrpc/*.

                          OFF by default, and it must be: the external API is how integrations,
                          e-commerce fronts and the customer's own scripts talk to Odoo, and turning
                          it off at the edge breaks them silently and from a place nobody thinks to
                          look. On for an environment nothing integrates with, which is most staging.
                        type: boolean
                      enforcement:
                        default: Block
                        description: |-
                          Enforcement is Block or Detect. Detect first is the right order on an
                          environment somebody depends on: a rule that turns out to match a
                          legitimate request blocks a customer's work, and the way to find that out
                          is to watch it for a week rather than to reason about it.
                        enum:
                        - Block
                        - Detect
                        type: string
                      extraDirectives:
                        description: |-
                          ExtraDirectives are appended verbatim, for rules doblura does not write.

                          The escape hatch, and it is a sharp one: a directive Coraza cannot parse
                          stops the whole WAF from starting, and it then lets everything through with
                          the reason only in the proxy's log. Change these on a Detect environment
                          first.
                        items:
                          type: string
                        type: array
                      mode:
                        default: None
                        description: WAFMode is who inspects requests, if anybody.
                        enum:
                        - None
                        - InCluster
                        - Provider
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: 'Provider mode passes annotations to the load balancer''s
                        own controller, so it needs at least one: with none, doblura
                        would report a WAF that nothing was asked to switch on'
                      rule: self.mode != 'Provider' || (has(self.annotations) && size(self.annotations)
                        > 0)
                type: object
                x-kubernetes-validations:
                - message: 'a public environment cannot be left unauthenticated: set
                    auth.type to BasicAuth or ForwardAuth'
                  rule: '!has(self.public) || !self.public || !has(self.auth) || self.auth.type
                    != ''None'''
                - message: a public environment needs a host
                  rule: '!has(self.public) || !self.public || has(self.host)'
              forTenant:
                description: |-
                  ForTenant is the customer this environment is FOR.

                  Setting it turns the environment into a handover, and the handover guardrail
                  applies: the operator refuses to expose it when the data comes from a
                  database that also holds other customers. Leaving it empty means the
                  environment is internal and no handover check runs.
                type: string
              fsGroup:
                default: 101
                format: int64
                minimum: 1
                type: integer
              image:
                minLength: 1
                type: string
              imageFlavor:
                default: Official
                description: |-
                  ImageFlavor is how this image is put together. Filled from the customer's
                  catalogue entry when imageRef names one, so it is normally set in exactly
                  one place per image rather than on every environment.
                enum:
                - Official
                - Doodba
                - Custom
                type: string
              imageRef:
                description: |-
                  ImageRef names an entry in the customer's image catalogue.

                  The field a person fills in. spec.image is the registry reference it
                  resolves to, written by the mutating webhook — which means an environment
                  records WHICH image it ran even after the catalogue entry is repointed at a
                  new build, and that is the difference between a reproducible environment
                  and one that quietly changed underneath somebody.

                  Naming both is an error rather than a precedence rule: a precedence rule is
                  a thing people have to remember, and getting it wrong here means running a
                  different version of the product than the screen says.

                  That check is in the mutating webhook and NOT a CEL rule, and the reason is
                  worth keeping. A CEL rule saying "not both" runs after admission mutation,
                  by which point the webhook has resolved imageRef into image and produced
                  exactly the state the rule forbids. It rejected every environment that used
                  a catalogue name — a rule firing on a condition the system itself creates.
                  Only the webhook sees what the client actually sent.
                maxLength: 63
                type: string
              lifecycle:
                default: {}
                description: EnvLifecycle is how long it lives.
                properties:
                  idleTimeout:
                    default: 2h
                    description: |-
                      IdleTimeout puts the environment to sleep after that long without
                      requests, when Type is Hibernating.
                    type: string
                  ttl:
                    default: 72h
                    description: |-
                      TTL destroys the environment that long after it was created.

                      Required for Ephemeral: "ephemeral" with no deadline means "permanent and
                      nobody remembers creating it", and a forgotten environment with real data
                      and a public URL is exactly the incident all of this is trying to
                      prevent.
                    type: string
                  type:
                    default: Ephemeral
                    description: EnvLifecycleType is how long the environment lives.
                    enum:
                    - Ephemeral
                    - Hibernating
                    - Persistent
                    type: string
                type: object
              mail:
                description: |-
                  Mail configures outgoing email. Absent means none, which is the right
                  answer for every environment that is not production.
                properties:
                  encryption:
                    default: StartTLS
                    description: MailEncryption is how the SMTP session is protected.
                    enum:
                    - None
                    - StartTLS
                    - SSL
                    type: string
                  fromFilter:
                    description: |-
                      FromFilter restricts which sender addresses use this server, which is
                      Odoo's own mechanism for having more than one.
                    type: string
                  host:
                    description: Host is the SMTP server.
                    minLength: 1
                    type: string
                  passwordSecret:
                    description: PasswordSecret holds the key "password".
                    type: string
                  port:
                    default: 587
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  smtpUser:
                    type: string
                  unsafeAcknowledgement:
                    description: |-
                      UnsafeAcknowledgement is required unless the purpose is Production.

                      The literal names the consequence and not the reading of a warning,
                      because the failure this guards against is somebody copying a production
                      manifest into staging and only the mail block being wrong.
                    type: string
                required:
                - host
                type: object
                x-kubernetes-validations:
                - message: 'an SMTP user needs a password: set passwordSecret to a
                    Secret holding the key ''password'''
                  rule: '!has(self.smtpUser) || has(self.passwordSecret)'
              migration:
                description: |-
                  Migration runs the module update as a STEP, before the environment is
                  exposed. Empty means no migration: restore and serve.

                  This is the only real difference from OdooRehearsal. There, the result of
                  the `-u` is a gate that decides whether something gets promoted. Here it is
                  simply the errand on the way to a usable environment running a future
                  version — which is exactly what "show the customer their data on Odoo 20"
                  needs. Same machinery, different purpose, and that is why they are two
                  types rather than one with a flag.
                properties:
                  engine:
                    default: ClickOdooUpdate
                    description: MigrationEngine selects how the module update is
                      executed.
                    enum:
                    - ClickOdooUpdate
                    - OdooUpdateAll
                    - Marabunta
                    type: string
                  extraArgs:
                    description: |-
                      ExtraArgs is appended to the command. An escape hatch: if you need it
                      often, a field is missing from this API.
                    items:
                      type: string
                    type: array
                  modules:
                    description: |-
                      Modules restricts the update to these modules. Empty means whatever the
                      engine decides.
                    items:
                      type: string
                    type: array
                type: object
              purpose:
                description: |-
                  Purpose is what this environment is FOR, and it is the field to fill in
                  first.

                  Everything else in this spec is a mechanism: a data source, a lifecycle, a
                  filestore mode, an exposure. Getting a staging server right means choosing
                  four of them consistently, and the combinations that are wrong are not
                  obviously wrong — a staging server with an Ephemeral filestore loses every
                  attachment on the first restart, and looks fine until somebody opens an
                  invoice.

                  So the purpose expands into those four, in the admission webhook, and only
                  where they were left empty. It is a starting point and not a straitjacket:
                  a consultant who needs a Persistent review environment says so and gets it.

                  What the purpose DOES enforce is the handful of combinations that are not
                  a preference but a mistake — production running demo data, or production
                  that deletes itself after three days.
                enum:
                - Review
                - QA
                - Staging
                - Production
                type: string
              runAsGroup:
                default: 101
                description: |-
                  RunAsGroup and FSGroup default to 101, Odoo's group in the same images.
                  FSGroup is what makes a mounted filestore writable: without it a PVC is owned
                  by root and Odoo cannot write an attachment to it.
                format: int64
                minimum: 1
                type: integer
              runAsUser:
                default: 100
                description: |-
                  RunAsUser is the uid the Odoo containers run as.

                  It defaults to 100, which is what the official Odoo image and OCA's OCB both
                  use. It exists as a field because the operator used to hardcode 65532 — the
                  distroless convention — and Odoo's startup calls getpass.getuser(), which
                  does pwd.getpwuid(os.getuid()) and raises KeyError for a uid that has no
                  passwd entry. Every environment pod failed before Odoo printed a line, with
                  a traceback that says nothing about uids being the problem.

                  Set it if your image uses a different user. Leave it if you do not know:
                  getting it wrong fails loudly and immediately, which is the good case.
                format: int64
                minimum: 1
                type: integer
              security:
                default: {}
                description: |-
                  Security carries default={} on purpose, and it is not cosmetic: without
                  it, omitting the whole block means its fields' defaults are NOT applied,
                  and an environment would come up without randomized passwords and without
                  closed egress WITHOUT ANYONE ASKING FOR THAT. With the empty default,
                  structural defaulting cascades and the controls stay on.
                properties:
                  adminUsers:
                    default:
                    - admin
                    description: |-
                      AdminUsers are the logins that keep a usable password, in a Secret the
                      operator generates. Everyone else is left with a random, unusable one.

                      Without this, randomizeUserPasswords leaves an environment nobody can log
                      into. With it, the people who should get in, get in.
                    items:
                      type: string
                    type: array
                  denyEgress:
                    default: true
                    description: |-
                      DenyEgress stops the pod from talking to anything but its own database.

                      MANDATORY when public. An exposed Odoo is a target, and what must be
                      prevented is reaching the internal network or the production database from
                      it. With this, compromising it only yields anonymized data.
                    type: boolean
                  randomizeUserPasswords:
                    description: |-
                      RandomizeUserPasswords replaces the dump's passwords with a random one,
                      different per environment, stored in a Secret.

                      MANDATORY when the environment is public. The dump OdooSnapshot produces
                      carries the same known password for every user, because a rehearsal
                      without an ingress needs that to be validated by hand. Serving that same
                      dump on a public URL hands over the administrator account.

                      NOT ON PRODUCTION, where it is refused outright: that is the customer's real
                      system and this locks every one of their users out.

                      No schema default, deliberately. It defaults to on for every purpose but
                      Production, and a `+kubebuilder:default=true` is applied by the API server
                      before anything else runs — so nothing downstream, webhook or CEL, can tell
                      a value somebody asked for from a value the schema filled in. With the
                      default in place the rule below refused every Production environment ever
                      created, including ones whose author had never heard of this field.
                    type: boolean
                  stripExternalCredentials:
                    description: |-
                      StripExternalCredentials deletes from ir_config_parameter the external
                      service keys neutralization does not cover: API tokens, webhook URLs,
                      OAuth secrets.

                      Neutralizing cuts mail, crons, payments and carriers. It does NOT touch
                      the credentials your own modules store there. That is the gap through
                      which a test environment ends up writing into a supplier's ERP.

                      NOT ON PRODUCTION, where it is refused outright: those are the real tokens
                      the customer's integrations run on. No schema default, for the reason given
                      on RandomizeUserPasswords.
                    type: boolean
                type: object
              size:
                description: |-
                  Size is the resource class.

                  It carries NO schema default, deliberately, and that is a correction. With
                  `+kubebuilder:default=medium` the API server filled it before any webhook
                  ran, so the customer's own default could never apply: the field was already
                  set by the time anything looked, and per-customer sizing was a field that
                  silently did nothing. An unset size is medium, decided in sizeToResources
                  where the table already lives.
                enum:
                - small
                - medium
                - large
                type: string
              sourceDatabase:
                description: |-
                  SourceDatabase is the OdooDatabase the snapshot came from, used by the
                  handover check to find out who else is inside it.
                type: string
              storage:
                description: |-
                  Storage is where the filestore lives. Absent means ephemeral, which is
                  correct for a throwaway environment and loses data for anything else.
                properties:
                  filestore:
                    description: FilestoreSpec says where the filestore lives and
                      admits what cannot be checked.
                    properties:
                      accessModeReadWriteMany:
                        description: |-
                          AccessModeReadWriteMany declares that the volume really is RWX.

                          Declared rather than detected, and the distinction is the honest part: a
                          StorageClass's supported access modes are not reliably knowable from here,
                          and a PVC that binds RWO while claiming RWX fails at scheduling rather than
                          at write time. So the operator requires the claim and refuses more than one
                          replica without it, instead of pretending it verified something.

                          Get it wrong in the optimistic direction and the second pod either never
                          schedules or serves a different filestore from the first.
                        type: boolean
                      claimName:
                        description: |-
                          ClaimName is an existing PVC. Use this when something else manages the
                          volume's lifecycle — which is usually right for staging, because the
                          filestore should outlive the OdooEnvironment object.
                        maxLength: 253
                        type: string
                      mode:
                        default: Ephemeral
                        description: FilestoreMode is where Odoo's filestore lives.
                        enum:
                        - Ephemeral
                        - PersistentVolumeClaim
                        - Database
                        type: string
                      size:
                        description: |-
                          Size creates a PVC owned by this environment. It is deleted with it, so a
                          staging built this way loses its attachments when the object is deleted.
                        pattern: ^[0-9]+(Mi|Gi|Ti)$
                        type: string
                      storageClass:
                        description: StorageClass for a created PVC.
                        maxLength: 253
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: a PersistentVolumeClaim filestore needs either claimName
                        (a PVC you manage) or size (one to create)
                      rule: self.mode != 'PersistentVolumeClaim' || has(self.claimName)
                        || has(self.size)
                    - message: claimName is meaningless with mode Ephemeral; the filestore
                        would still be an emptyDir and the claim would go unused,
                        which is worse than an error
                      rule: self.mode != 'Ephemeral' || !has(self.claimName)
                    - message: mode Database keeps attachments in Postgres, so there
                        is no filestore for a claim or a size to describe
                      rule: self.mode != 'Database' || (!has(self.claimName) && !has(self.size))
                type: object
              update:
                description: Update says when the modules are brought in line with
                  the code.
                properties:
                  modules:
                    description: |-
                      Modules restricts what is updated. Empty means "whatever changed", which
                      is what click-odoo-update is for and what you want almost always.
                    items:
                      type: string
                    type: array
                  onStart:
                    description: |-
                      OnStart runs click-odoo-update before the server starts, every time the
                      pod starts.

                      Left unset it follows the purpose: on for Review and QA, off for Staging
                      and Production. Set it explicitly and it is honoured — somebody running
                      staging as a rolling rehearsal of production is not wrong.

                      A pointer because false is a real answer that must survive the defaulting:
                      with a plain bool an explicit "no" is indistinguishable from "unset" and
                      would be overwritten by the purpose.
                    type: boolean
                  rollback:
                    description: |-
                      Rollback takes a copy of the database before updating and puts it back if
                      the update fails.

                      This is what makes updating production something other than frightening. A
                      module update that fails halfway leaves a database that is neither the old
                      schema nor the new one: some tables altered, some not, and the registry
                      describing a state that does not exist. There is no forward fix for that
                      and the only real recovery is a restore — so the copy is taken while
                      somebody is still watching, rather than found to be missing afterwards.

                      odoo.sh does the same thing and calls it reverting to the previous working
                      state. The mechanism here is click-odoo-copydb, which uses Postgres's own
                      CREATE DATABASE ... TEMPLATE and copies the filestore beside it.

                      Two costs, both real and both worth saying rather than discovering:

                        - It needs as much free disk as the database occupies, for as long as the
                          update runs. A 40 GiB database needs 40 GiB spare.
                        - CREATE DATABASE ... TEMPLATE refuses while anything else is connected.
                          The update runs in an init container with the server not yet started
                          and the Deployment on the Recreate strategy, so nothing is — but an
                          external tool holding a session will make the copy fail, and the
                          message says so.

                      Left unset it follows the purpose: off for Review, on for QA, Staging and
                      Production. A review environment holds demo data and the recovery is to
                      delete it; paying for a copy of that would be paying for nothing.
                    type: boolean
                  timeout:
                    default: 20m
                    description: |-
                      Timeout bounds the update. An update that hangs holds the pod in its init
                      phase, and a review environment that never starts is harder to diagnose
                      than one that starts and says the update failed.
                    type: string
                type: object
              workload:
                description: |-
                  Workload splits the environment's processes. Absent means one deployment
                  serving HTTP and running crons, which is right for a throwaway environment
                  and wrong for a persistent one.
                properties:
                  cron:
                    description: |-
                      Cron runs ir.cron and nothing else.

                      Absent means the historical behaviour: one deployment doing both. That is
                      deliberately still the default, because it is right for an ephemeral
                      environment somebody opens for twenty minutes.
                    properties:
                      replicas:
                        default: 1
                        description: Replicas is 0 or 1. See the guardrail on WorkloadSplit.
                        format: int32
                        maximum: 1
                        minimum: 0
                        type: integer
                      threads:
                        default: 2
                        description: |-
                          Threads is max_cron_threads on the cron tier.

                          More than one lets independent jobs run in parallel. It does not make a
                          single slow job faster, and it is the setting people raise when the real
                          problem is one job.
                        format: int32
                        maximum: 8
                        minimum: 1
                        type: integer
                    type: object
                  queueJob:
                    description: |-
                      QueueJob runs OCA's queue_job runner.

                      Optional in the strong sense: queue_job is an OCA addon and most
                      installations do not have it. Asking for this tier without the module on the
                      addons path produces a pod that starts and does nothing, so the operator
                      reports that rather than leaving it running.
                    properties:
                      channels:
                        description: |-
                          Channels is queue_job's channel configuration, e.g. "root:2,export:1".
                          Passed through unread: it is queue_job's syntax, and validating somebody
                          else's grammar here would only ever be wrong in a new version.
                        maxLength: 512
                        type: string
                      replicas:
                        default: 1
                        format: int32
                        maximum: 1
                        minimum: 0
                        type: integer
                    type: object
                  web:
                    description: |-
                      Web serves HTTP. When a cron section is present this tier runs with
                      max_cron_threads = 0, so crons happen in exactly one place.
                    properties:
                      replicas:
                        default: 1
                        format: int32
                        maximum: 32
                        minimum: 0
                        type: integer
                      workers:
                        description: |-
                          Workers is Odoo's HTTP worker count.

                          0 means threaded mode, which is what you want for a small environment: the
                          prefork pool costs memory per worker and buys nothing under one user.
                        format: int32
                        maximum: 64
                        minimum: 0
                        type: integer
                    type: object
                type: object
                x-kubernetes-validations:
                - message: 'cron.replicas may be at most 1: every replica polls ir_cron
                    independently, and the per-job advisory lock is the only thing
                    preventing a job that was not written to be re-entrant from overlapping
                    with itself'
                  rule: '!has(self.cron) || !has(self.web) || self.web.replicas ==
                    0 || self.cron.replicas <= 1'
                - message: 'queueJob.replicas may be at most 1: OCA''s queue_job runner
                    is a singleton by design, and a second one is a supported way
                    to process the same job twice'
                  rule: '!has(self.queueJob) || self.queueJob.replicas <= 1'
            required:
            - data
            - database
            - image
            type: object
            x-kubernetes-validations:
            - message: 'a public environment requires security.randomizeUserPasswords:
                the OdooSnapshot dump carries the same known password for every user
                and would hand the administrator account to anyone'
              rule: '!has(self.exposure) || !has(self.exposure.public) || !self.exposure.public
                || (has(self.security) && (!has(self.security.randomizeUserPasswords)
                || self.security.randomizeUserPasswords))'
            - message: 'a public environment requires security.denyEgress: if it is
                compromised it must not be able to reach the internal network or the
                production database'
              rule: '!has(self.exposure) || !has(self.exposure.public) || !self.exposure.public
                || (has(self.security) && (!has(self.security.denyEgress) || self.security.denyEgress))'
            - message: 'combining anonymized data with public access requires data.acknowledgeReidentificationRisk
                set to its literal value: deterministic masking preserves relations
                and dates, and that allows re-identification'
              rule: '!has(self.exposure) || !has(self.exposure.public) || !self.exposure.public
                || self.data.type != ''Snapshot'' || self.data.acknowledgeReidentificationRisk
                == ''i-accept-anonymized-data-can-still-be-reidentified'''
            - message: data.type Snapshot requires the data.snapshot field
              rule: self.data.type != 'Snapshot' || has(self.data.snapshot)
            - message: 'configuring outgoing mail on anything but a Production environment
                requires mail.unsafeAcknowledgement set to its literal value: a working
                SMTP server on a copy of production sends real invoices and real payment
                reminders to real people, from a machine nobody is watching, and there
                is no undo'
              rule: '!has(self.mail) || (has(self.purpose) && self.purpose == ''Production'')
                || (has(self.mail.unsafeAcknowledgement) && self.mail.unsafeAcknowledgement
                == ''i-accept-this-environment-can-send-real-email-to-real-people'')'
            - message: an environment running demo data has no real addresses to write
                to, and every message it sends goes to an invented one. If you are
                testing the mail server itself, use Snapshot data with the acknowledgement,
                or Live
              rule: '!has(self.mail) || self.data.type != ''Demo'''
            - message: 'security.randomizeUserPasswords cannot be asked for on a Production
                environment: that is the customer''s real system, and this locks every
                one of their users out. It is what makes a COPY safe, and doblura
                does not run it here at all — accepting the field would be promising
                something that will not happen'
              rule: '!has(self.purpose) || self.purpose != ''Production'' || !has(self.security)
                || !has(self.security.randomizeUserPasswords) || !self.security.randomizeUserPasswords'
            - message: 'security.stripExternalCredentials cannot be asked for on a
                Production environment: those are the real API tokens and webhook
                URLs the customer''s integrations run on, not a copy''s inherited
                ones'
              rule: '!has(self.purpose) || self.purpose != ''Production'' || !has(self.security)
                || !has(self.security.stripExternalCredentials) || !self.security.stripExternalCredentials'
            - message: 'a Production environment runs the customer''s own data: demo
                data is not production, and an anonymized snapshot called production
                is a copy people will start trusting. Set data.type to Live, or change
                the purpose'
              rule: '!has(self.purpose) || self.purpose != ''Production'' || self.data.type
                == ''Live'''
            - message: 'a Production environment cannot be Ephemeral or Hibernating:
                the first deletes the customer''s Odoo when its time is up and the
                second switches it off'
              rule: '!has(self.purpose) || self.purpose != ''Production'' || !has(self.lifecycle)
                || self.lifecycle.type == ''Persistent'''
            - message: 'a Staging or Production environment cannot keep its filestore
                in an emptyDir: the database outlives the pod and the files do not,
                so every attachment breaks on the first restart while ir_attachment
                still points at them'
              rule: '!has(self.purpose) || (self.purpose != ''Staging'' && self.purpose
                != ''Production'') || !has(self.storage) || !has(self.storage.filestore)
                || self.storage.filestore.mode != ''Ephemeral'''
            - message: 'a Persistent or Hibernating environment cannot use an Ephemeral
                filestore (use PersistentVolumeClaim, or Database to keep attachments
                in Postgres and have no filestore at all): the database outlives the
                pod and the files do not, so every attachment breaks on the first
                restart while ir_attachment still points at them'
              rule: '!has(self.lifecycle) || self.lifecycle.type == ''Ephemeral''
                || !has(self.storage) || !has(self.storage.filestore) || self.storage.filestore.mode
                != ''Ephemeral'''
            - message: 'more than one web replica needs a filestore every pod can
                reach: either PersistentVolumeClaim declared ReadWriteMany, or Database,
                which has no filestore to share: each pod would otherwise serve its
                own filestore, so an attachment uploaded through one is a 404 through
                the other'
              rule: '!has(self.workload) || !has(self.workload.web) || self.workload.web.replicas
                <= 1 || (has(self.storage) && has(self.storage.filestore) && (self.storage.filestore.mode
                == ''Database'' || (self.storage.filestore.mode == ''PersistentVolumeClaim''
                && self.storage.filestore.accessModeReadWriteMany)))'
            - message: 'a cron tier is a second pod writing the same filestore and
                needs one both tiers can reach: either PersistentVolumeClaim declared
                ReadWriteMany, or Database: scheduled jobs that generate reports or
                attachments would otherwise write them where the web tier cannot read
                them, and a ReadWriteOnce claim only appears to work while both pods
                happen to land on the same node'
              rule: '!has(self.workload) || !has(self.workload.cron) || self.workload.cron.replicas
                == 0 || (has(self.storage) && has(self.storage.filestore) && (self.storage.filestore.mode
                == ''Database'' || (self.storage.filestore.mode == ''PersistentVolumeClaim''
                && self.storage.filestore.accessModeReadWriteMany)))'
          status:
            description: OdooEnvironmentStatus is written by the controller only.
            properties:
              addonRevisions:
                description: |-
                  AddonRevisions is the commit each declared repository was ACTUALLY at.

                  spec.addons.repos[].ref is what was ASKED for, and a branch name is not an
                  answer to "what code is this running". Somebody looking at a broken
                  environment, or at a rehearsal that passed, needs the commit — and the
                  clone container's log, which is where it used to live, disappears with the
                  Job that produced it.
                items:
                  description: AddonRevision is one repository, as it was actually
                    cloned.
                  properties:
                    name:
                      description: Name matches spec.addons.repos[].name.
                      type: string
                    observedAt:
                      description: |-
                        ObservedAt is when the clone happened, which is the moment a branch stopped
                        being a moving target for this environment.
                      format: date-time
                      type: string
                    ref:
                      description: 'Ref is what was asked for: a branch, a tag or
                        a commit.'
                      type: string
                    revision:
                      description: |-
                        Revision is the commit it resolved to. With a commit ref the two are the
                        same, and that is the point — a branch drifts and this does not.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialsSecret:
                description: |-
                  CredentialsSecret is the Secret holding the generated passwords for the
                  adminUsers. It is the only way in once passwords are randomized.
                type: string
              expiresAt:
                description: |-
                  ExpiresAt is when it gets destroyed.
                  Printed as a string rather than a date column: kubectl renders a date
                  column as the time SINCE the value, and an expiry is in the future, which
                  it prints as "<invalid>". The column that says when this gets deleted read
                  as broken for the whole of the environment's life.
                format: date-time
                type: string
              lastRequestTime:
                format: date-time
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: EnvPhase summarises the state.
                enum:
                - Pending
                - Provisioning
                - Restoring
                - Hardening
                - Ready
                - Hibernated
                - Expired
                - Failed
                type: string
              readyAt:
                description: |-
                  ReadyAt is when this environment first became usable.

                  Not the same as creationTimestamp, and the difference is the whole reason it
                  exists: restoring a 40 GiB snapshot takes minutes to hours, and nobody should
                  be charged for — or credited with — the time before anything was reachable.
                  Set once and never moved, so a hibernate/wake cycle does not reset it.
                format: date-time
                type: string
              terminatedAt:
                description: |-
                  TerminatedAt is when it stopped consuming.

                  Recorded on the object rather than inferred from its disappearance, because a
                  deleted object cannot be asked anything. Whatever accounting exists has to
                  have seen this before the object goes.
                format: date-time
                type: string
              tls:
                description: |-
                  TLS says whose certificate answers on this address.

                  It exists because the alternative is a status that reads https:// while the
                  ingress controller serves its own self-signed default — every address
                  works, every browser warns, and people learn to click through certificate
                  warnings, which is the habit that makes the warning worthless.
                enum:
                - Issued
                - DefaultCertificate
                type: string
              url:
                type: string
              waf:
                description: |-
                  WAF is what was configured to inspect requests, and it is worth being
                  precise about what this does NOT say.

                  It reports the mode doblura wrote, not that inspection is happening. Coraza
                  fails OPEN: a directive it cannot parse stops the WAF from starting and
                  every request then passes uninspected, with the reason only in the ingress
                  proxy's log. In Provider mode doblura only copied annotations and never saw
                  the thing they configure. Neither is something this operator can check, and
                  a status that implied otherwise would be worse than no status.
                enum:
                - None
                - InCluster
                - Provider
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
