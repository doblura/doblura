# The defaults work in production untouched. If ten values were needed just to
# start, the chart would not be reusable.

# Overrides the chart's base name.
nameOverride: ""

image:
  repository: ghcr.io/doblura/doblura
  # Empty means the chart's appVersion. That way a chart upgrade brings the
  # matching image, with no second place to keep in sync.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

# Leader election. With replicaCount > 1 it is MANDATORY: two managers creating
# Jobs for the same rehearsal would run it twice, and a duplicated migration
# against the same database is not idempotent.
leaderElection:
  enabled: false

crds:
  # The CRDs live in templates/ rather than crds/ so `helm upgrade` updates
  # them: the ones in crds/ are only ever installed, never upgraded.
  install: true
  # And with resource-policy keep, so a `helm uninstall` does not take
  # everyone's OdooRehearsal objects down with it.
  keep: true

rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

# The operator only watches these namespaces. Empty means all of them.
# Restricting it reduces cache memory and RBAC scope.
watchNamespaces: []

# The admission webhook, which is where the environment quota is enforced.
#
# `OdooTenant.spec.maxEphemeralEnvironments` is a number on the customer record and
# nothing else reads it: with the webhook off, that field does nothing and the
# cluster is bounded only by how much anyone feels like creating.
#
# There is deliberately no failurePolicy value here. It is Fail, the reasoning is
# in internal/webhook/quota.go, and offering Ignore as a value would make "turn the
# safety limit off" a --set away from anyone with a slow API server. If you need
# the quota gone, turn the whole webhook off: that at least leaves a trace in the
# release.
webhook:
  enabled: true
  # The port the manager serves admission on. The Service publishes 443 in front
  # of it, which is what the API server dials.
  port: 9443
  # How many ephemeral environments one person may hold at once, across every
  # customer AND every namespace.
  #
  # Cluster-wide on purpose: the persona ClusterRoles are meant to be bound
  # cluster-wide, so an allowance that reset per namespace would be this number
  # multiplied by the number of namespaces. The per-customer limit is a separate
  # thing and lives on each OdooTenant.
  maxEnvironmentsPerCreator: 5
  # Identities the quota does not apply to, as they appear to the API server
  # ("system:serviceaccount:<namespace>:<name>"). The operator's own
  # ServiceAccount is always exempt and does not need listing.
  #
  # Keep this short. Every entry is somebody who can exhaust the cluster.
  exemptUsers: []

metrics:
  enabled: true
  port: 8080
  service:
    enabled: true
  # ServiceMonitor for the Prometheus Operator. Off by default: if Prometheus's
  # CRDs are absent, the apply fails.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# Resources for the manager, not for the rehearsals. The manager is a small
# controller: the heavy lifting happens in Jobs, whose size is declared through
# spec.size on each OdooRehearsal.
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

# The personas: one ClusterRole per kind of person who works on the customer
# list. Bind them to your OIDC groups; templates/personas.yaml says what each one
# may do and, more usefully, what it deliberately may not.
#
# On by default, because they grant nothing on their own: a ClusterRole with no
# RoleBinding is inert. Having them present is what makes the first binding a
# one-liner instead of an afternoon spent reading verbs.
personas:
  create: true

# Observing an OdooInstance: server version, database count, and the free disk that
# makes capacity.reservedGi mean anything.
#
# The probe is a short-lived Pod running psql, not a connection from the manager —
# so the manager holds no database credential and needs no network path to your
# Postgres. See internal/controller/instance_probe.go for what that costs.
#
# Unlike `defaults` below, this value is wired end to end: it becomes a flag on the
# manager. Needs psql, sh, df and awk.
instanceProbe:
  image: postgres:18-alpine

logLevel: info
# console to read in a terminal, json to aggregate in Loki or similar.
logFormat: console

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# Cluster-wide defaults for the auxiliary containers. They fill in the fields
# that are almost always the same, so each OdooRehearsal does not repeat them.
defaults:
  # Image of the object-store fetcher. Here so you can pin it to a digest or
  # point it at an internal mirror in air-gapped environments.
  objectStoreImage: rclone/rclone:latest
  httpImage: curlimages/curl:latest
  gitImage: alpine/git:latest

# ── The console ──
#
# Off by default. It needs an identity provider or an accounts Secret and a
# session key, and a console that installs itself with none of those would either
# refuse to start (a confusing default) or serve the customer list to whoever
# reaches it (a much worse one).
console:
  enabled: false
  replicaCount: 1

  # Sign-in. At least one of oidc.issuer or localAccounts.secretName must be set;
  # the console refuses to start with neither, rather than serving anonymously.
  oidc:
    issuer: ""
    clientID: ""
    # This console's own /auth/callback URL, as the provider will redirect to it.
    redirectURL: ""
    groupsClaim: groups
    # Secret holding key `clientSecret`. Read from the environment, never a flag.
    clientSecretSecret: ""

  localAccounts:
    # Secret holding one key per user: "<bcrypt hash>:group,group".
    # Generate a hash with:  kubectl run -it --rm hash --image=<doblura image> \
    #   --restart=Never --command -- /console hash
    secretName: ""

  # Secret holding key `sessionKey`: at least 32 base64-encoded bytes, IDENTICAL
  # across replicas. Create one with:
  #   kubectl -n <ns> create secret generic doblura-console-session \
  #     --from-literal=sessionKey="$(head -c 32 /dev/urandom | base64)"
  sessionKeySecret: ""

  ingress:
    enabled: false
    className: ""
    host: ""
    tlsSecretName: ""
    annotations: {}

  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
