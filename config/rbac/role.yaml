---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: doblura-manager
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingwebhookconfigurations
  - validatingwebhookconfigurations
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - doblura.dev
  resources:
  - odoobackups
  - odoodatabases
  - odooinstances
  - odoorestores
  - odootenants
  - reviewsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - doblura.dev
  resources:
  - odoobackups/status
  - odooenvironments/status
  - odooinstances/status
  - odoorehearsals/status
  - odoorestores/status
  - odoosnapshots/status
  - odootenants/status
  - reviewsets/status
  - runboatlinks/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - doblura.dev
  resources:
  - odooenvironments
  - odoorehearsals
  - odoosnapshots
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - doblura.dev
  resources:
  - odooenvironments/finalizers
  verbs:
  - update
- apiGroups:
  - doblura.dev
  resources:
  - runboatlinks
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
