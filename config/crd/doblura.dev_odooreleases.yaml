---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: odooreleases.doblura.dev
spec:
  group: doblura.dev
  names:
    kind: OdooRelease
    listKind: OdooReleaseList
    plural: odooreleases
    shortNames:
    - orel
    singular: odoorelease
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.onThisRelease
      name: On it
      type: integer
    - jsonPath: .status.waiting
      name: Waiting
      type: integer
    - jsonPath: .status.nextBatchAt
      name: Next batch
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OdooRelease moves one version of YOUR OWN PRODUCT across many customers.

          The kind an integrator needs and a single-Odoo company does not: thirty
          customers on a product you maintain, a new version of it, and the question of
          how it reaches them without either thirty manual afternoons or one afternoon
          that breaks thirty customers at once.

          # WHAT IT DOES AND WHAT IT DELIBERATELY DOES NOT

          It moves a customer onto the release: the image goes into their catalogue and
          their record says which version they are on. From then on, every environment
          they open runs it.

          It does NOT reach into a running Production environment and change its image.
          That is a migration against live data, and this operator exists precisely
          because that is the thing you rehearse and then decide, with somebody watching.
          An operator that did it on a timer would be automating away the only step that
          was ever worth a person's attention. When a customer is ready, moving their
          production is one edit, made by somebody who chose the moment.

          THE THREE THINGS THAT KEEP IT FROM BEING A FLEET-WIDE ACCIDENT

            - The selector. A customer is in scope because their record carries a label
              somebody put there. There is no "all customers" mode.
            - The rehearsal. A customer is not moved until a rehearsal OF THEIR DATA
              against this exact image has passed. That is the whole thesis of this
              operator applied to itself.
            - The batch. A few at a time, with a soak between them, and the rollout stops
              the moment one of them ends up in a bad state rather than carrying on into
              the next batch.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OdooReleaseSpec is the version, who gets it, and how fast.
            properties:
              batch:
                description: |-
                  Batch is how many customers move at once, and how long to wait before the
                  next few.
                properties:
                  size:
                    default: 3
                    description: |-
                      Size is how many customers move in one go.

                      Small by default, and this is a real default rather than a placeholder: the
                      point of batching is that the first few customers are the ones who find out
                      what the release does to real data, and a batch big enough to be efficient
                      is a batch big enough to make that discovery expensive.
                    format: int32
                    type: integer
                  soak:
                    default: 24h
                    description: |-
                      Soak is how long to leave a batch alone before starting the next.

                      A day by default. Most of what a bad release does to an Odoo shows up when
                      somebody uses it, not when it starts, so an hour proves the pods are up and
                      very little else.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: a batch of zero customers never moves anybody
                  rule: '!has(self.size) || self.size >= 1'
              fromBuild:
                description: FromBuild names an OdooBuild instead, and takes the digest
                  it produced.
                type: string
              image:
                description: |-
                  Image is the artifact, and a DIGEST is the only form that means anything: a
                  rollout that took a week and a tag that moved on Tuesday is a rollout where
                  half the customers are on something nobody chose.
                type: string
              requireRehearsal:
                default: true
                description: |-
                  RequireRehearsal gates each customer on a rehearsal of THEIR data against
                  this exact image.

                  Turning it off needs the acknowledgement below, because it removes the only
                  thing that distinguishes this from a `kubectl set image` across thirty
                  customers.
                type: boolean
              selector:
                description: |-
                  Selector is which customers are in scope, and it is the opt-in.

                  There is deliberately no "everybody" — not as a default, not as an empty
                  selector meaning all. A rollout that reaches a customer nobody added to it
                  is the accident this kind is shaped to prevent, and an empty selector is
                  how every other Kubernetes API spells "everybody".
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              unrehearsedAcknowledgement:
                description: UnrehearsedAcknowledgement is required, literally, to
                  turn the gate off.
                type: string
              version:
                description: |-
                  Version is what this release is called in your own numbering. It is written
                  onto each customer's record as they move, so "who is on what" is a question
                  with an answer.
                minLength: 1
                type: string
            required:
            - selector
            - version
            type: object
            x-kubernetes-validations:
            - message: a release names an image OR the build that produces it, and
                exactly one
              rule: has(self.image) != has(self.fromBuild)
            - message: 'a release needs a selector that selects something: an empty
                one means every customer in this namespace, which is the accident
                this kind is shaped to prevent'
              rule: has(self.selector.matchLabels) || has(self.selector.matchExpressions)
            - message: turning requireRehearsal off removes the only thing that distinguishes
                this from `kubectl set image` across every customer at once, so it
                needs unrehearsedAcknowledgement set to its literal value
              rule: '!has(self.requireRehearsal) || self.requireRehearsal || self.unrehearsedAcknowledgement
                == ''i-accept-moving-customers-onto-a-version-nobody-rehearsed'''
          status:
            description: OdooReleaseStatus is where the rollout has got to.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              customers:
                description: |-
                  Customers is each one in scope and where it stands.

                  Every customer, not only the interesting ones: a rollout list that shows
                  what moved and hides what did not is a list that reads as finished.
                items:
                  description: ReleaseCustomer is one customer's position in a rollout.
                  properties:
                    movedAt:
                      description: MovedAt is when this customer was put on the release.
                      format: date-time
                      type: string
                    name:
                      type: string
                    state:
                      description: |-
                        State is one of: onRelease, rehearsing, notRehearsed, waitingForBatch,
                        blocked.
                      type: string
                    why:
                      description: Why is the sentence for anything that is not simply
                        "on it".
                      type: string
                  required:
                  - name
                  - state
                  type: object
                type: array
              image:
                description: |-
                  Image is what this release resolved to, recorded so a rollout that spanned
                  a week can be read afterwards without wondering whether the tag moved.
                type: string
              inScope:
                description: InScope, OnThisRelease and Waiting are the three numbers
                  somebody wants.
                format: int32
                type: integer
              lastMovedAt:
                description: |-
                  LastMovedAt is when the most recent customer was moved, which is what the
                  soak counts from.
                format: date-time
                type: string
              message:
                type: string
              nextBatchAt:
                description: NextBatchAt is when the soak ends. Empty when nothing
                  is waiting on time.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              onThisRelease:
                format: int32
                type: integer
              phase:
                description: ReleasePhase summarises a rollout in one word.
                enum:
                - Pending
                - Rolling
                - Soaking
                - Blocked
                - Complete
                type: string
              waiting:
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
