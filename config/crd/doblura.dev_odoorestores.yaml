---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: odoorestores.doblura.dev
spec:
  group: doblura.dev
  names:
    kind: OdooRestore
    listKind: OdooRestoreList
    plural: odoorestores
    shortNames:
    - orst
    singular: odoorestore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.copy
      name: Copy
      type: string
    - jsonPath: .spec.into
      name: Into
      type: string
    - jsonPath: .status.requestedBy
      name: Asked by
      type: string
    - jsonPath: .status.startedAt
      name: Started
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OdooRestore puts one backup back into one environment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OdooRestoreSpec says which copy goes where.

              The whole spec is immutable. A restore that could be edited is a restore that
              can be pointed somewhere else after somebody approved it, and the object exists
              partly to be the record of what was approved.
            properties:
              acknowledgement:
                description: Acknowledgement must name the target environment. See
                  the CEL message.
                minLength: 1
                type: string
              backup:
                description: Backup is the OdooBackup the copy belongs to, in this
                  namespace.
                minLength: 1
                type: string
              copy:
                description: Copy is the name of the copy, as status.copies lists
                  it.
                minLength: 1
                type: string
              into:
                description: |-
                  Into is the environment whose database and filestore are REPLACED.

                  It does not have to be the environment the copy came from, and that is the
                  point: restoring production's backup into staging is how somebody
                  reproduces a bug with the data that caused it.
                minLength: 1
                type: string
              neutralize:
                default: true
                description: |-
                  Neutralize disables scheduled actions, outgoing mail and payment providers
                  in the restored copy.

                  Defaults to TRUE, and the default is the one that matters. A production
                  backup restored into staging with its crons live will send real invoices to
                  real customers from a machine nobody is watching. Turning it off is for
                  restoring production onto production, which is the rarer case and the one
                  worth having to say out loud.
                type: boolean
              safetyCopy:
                description: |-
                  SafetyCopy takes a backup of what is in the target NOW, before replacing it.

                  This is the guardrail that matters, and it is worth saying why it is a copy
                  rather than another acknowledgement to type. The acknowledgement names the
                  target, which stops a manifest copied from staging to production — but
                  people paste the acknowledgement out of the error message, and no string
                  helps at all against the other mistake, which is restoring the RIGHT
                  environment from the WRONG copy. That one is only survivable if there is a
                  way back.

                  So the restore Job takes a copy first and the restore only happens if that
                  copy succeeded. A failed safety copy means no restore, which is the correct
                  order: refusing to replace a database is recoverable, replacing it with no
                  way back is not.

                  Deliberately NOT given a schema default. A default here is applied before
                  admission, which would make the field indistinguishable from one somebody
                  set, and the whole point is that the answer depends on the target: a
                  production or staging environment gets one, a review environment nobody
                  will miss does not. The webhook resolves it, and refuses to turn it off for
                  Production at all.
                type: boolean
              timeout:
                default: 4h
                description: Timeout bounds the restore.
                type: string
            required:
            - acknowledgement
            - backup
            - copy
            - into
            type: object
            x-kubernetes-validations:
            - message: 'a restore cannot be edited once it exists: create another
                one. This object is the record of what was asked for, and a record
                that can be changed afterwards is not a record'
              rule: self == oldSelf
            - message: 'the acknowledgement must name the environment being restored
                INTO, exactly: ''i-accept-this-replaces-the-database-and-filestore-of-<environment>''.
                It names the target because a restore file copied from staging to
                production is a plausible accident, and retyping the name is the cheapest
                thing that stops it'
              rule: self.acknowledgement == 'i-accept-this-replaces-the-database-and-filestore-of-'
                + self.into
          status:
            description: OdooRestoreStatus is how it went.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              finishedAt:
                format: date-time
                type: string
              message:
                description: Message is what went wrong, in the words of whatever
                  said it.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: RestorePhase is where a restore has got to.
                enum:
                - Pending
                - Restoring
                - Succeeded
                - Failed
                type: string
              requestedBy:
                description: |-
                  RequestedBy is who asked, taken from the authenticated identity and not
                  from anything the client sent.
                type: string
              safetyCopy:
                description: |-
                  SafetyCopy is the name of the copy taken of what WAS in the target, and
                  SafetyCopyIn is the OdooBackup holding it.

                  On this object rather than only on the backup, because this is the record of
                  what was replaced and the way back belongs beside it. Somebody looking at a
                  bad afternoon has one object that says what was restored, who asked, and
                  what to restore to undo it.
                type: string
              safetyCopyIn:
                type: string
              startedAt:
                description: |-
                  StartedAt and FinishedAt bound how long the environment was unusable,
                  which is the number somebody reports afterwards.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
