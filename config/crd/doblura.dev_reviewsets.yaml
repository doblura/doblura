---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: reviewsets.doblura.dev
spec:
  group: doblura.dev
  names:
    kind: ReviewSet
    listKind: ReviewSetList
    plural: reviewsets
    shortNames:
    - rset
    singular: reviewset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.forTenant
      name: Customer
      type: string
    - jsonPath: .spec.repository.url
      name: Repository
      type: string
    - jsonPath: .status.open
      name: Open
      type: integer
    - jsonPath: .status.skipped
      name: Skipped
      type: integer
    - jsonPath: .status.lastPolled
      name: Polled
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ReviewSet materialises environments from a repository's pull requests and
          branches.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ReviewSetSpec describes what to watch and what to make of
              it.
            properties:
              forTenant:
                description: |-
                  ForTenant is the customer these environments belong to. Their record
                  supplies the image, the database and the modules, exactly as it does for an
                  environment somebody creates by hand.
                minLength: 1
                type: string
              maxEnvironments:
                default: 5
                description: |-
                  MaxEnvironments caps how many this set may have open at once.

                  Separate from the customer's own quota, and below it: a repository with
                  forty open pull requests should not consume a customer's entire allowance
                  on its own, and the failure mode without this is that the fortieth pull
                  request takes staging's place.
                format: int32
                maximum: 50
                minimum: 0
                type: integer
              paused:
                description: |-
                  Paused stops creating and removing without deleting the set, for the day
                  somebody needs the noise to stop and does not want to lose the
                  configuration.
                type: boolean
              pollInterval:
                default: 1m
                description: |-
                  PollInterval is how often the forge is asked.

                  Asked rather than told: a webhook needs this operator to be reachable from
                  the internet, which most clusters running a customer's ERP are not. A
                  minute is well inside every forge's rate limit for a single repository.
                type: string
              repository:
                description: Repository is what to watch.
                properties:
                  apiBase:
                    description: |-
                      APIBase overrides the forge's API root, for self-hosted instances.
                      Empty means the public one for the provider.
                    type: string
                  auth:
                    description: |-
                      Auth reads the repository. A public repository still needs this on GitHub
                      if you would rather not be rate-limited by IP.

                      The token wants the narrowest scope the forge offers: on GitHub that is a
                      fine-grained token with pull requests read-only, and nothing else.
                    properties:
                      secretRef:
                        description: |-
                          SecretRef is the Secret holding the keys the Type requires. It must live
                          in the same namespace as the OdooRehearsal: reading Secrets from other
                          namespaces would turn Doblura into a privilege-escalation vector.
                        minLength: 1
                        type: string
                      type:
                        description: |-
                          Type is the mechanism. Explicit on purpose: see the package comment on
                          why it is not inferred.
                        enum:
                        - Token
                        - BasicAuth
                        - SSHKey
                        - GitHubApp
                        type: string
                      username:
                        description: |-
                          Username overrides the forge's default username. It only applies to
                          Token. Left empty, it is derived from the URL: x-access-token for
                          github.com, oauth2 for gitlab.com.
                        type: string
                    required:
                    - secretRef
                    - type
                    type: object
                  provider:
                    description: |-
                      Provider is which API to ask. Declared rather than guessed from the URL:
                      self-hosted GitLab and Gitea live on their own domains.
                    enum:
                    - GitHub
                    - GitLab
                    type: string
                  url:
                    description: URL is the repository, as you would clone it.
                    minLength: 1
                    type: string
                required:
                - provider
                - url
                type: object
              template:
                description: Template is the environment to create for each of them.
                properties:
                  imageRef:
                    description: ImageRef names an entry in the customer's image catalogue.
                    type: string
                  paths:
                    description: Paths are the subdirectories of the repository holding
                      addons.
                    items:
                      type: string
                    type: array
                  purpose:
                    default: Review
                    description: Purpose defaults to Review.
                    type: string
                  repoName:
                    description: |-
                      RepoName is the name the watched repository is given in the environment's
                      addons list. Defaults to the ReviewSet's own name.
                    type: string
                  ttl:
                    description: TTL overrides how long each environment lives. Empty
                      follows the purpose.
                    type: string
                type: object
              watch:
                description: Watch says which refs become environments.
                properties:
                  branches:
                    description: |-
                      Branches are glob patterns: "main", "release/*".

                      Patterns and not a list of names, because the branches worth an
                      environment are a shape — every release branch — and enumerating them by
                      hand is the thing this exists to stop.
                    items:
                      type: string
                    type: array
                  labels:
                    description: |-
                      Labels restricts pull requests to those carrying one of these labels.

                      Most pull requests do not need an environment. A label is how a person
                      says this one does, and it is a decision they can make in the tab they are
                      already looking at.
                    items:
                      type: string
                    type: array
                  pullRequests:
                    description: PullRequests creates one environment per open pull
                      request.
                    type: boolean
                type: object
            required:
            - forTenant
            - repository
            - watch
            type: object
            x-kubernetes-validations:
            - message: 'a ReviewSet that watches neither pull requests nor any branch
                would create nothing: set watch.pullRequests, or list watch.branches'
              rule: has(self.watch) && (self.watch.pullRequests || size(self.watch.branches)
                > 0)
          status:
            description: ReviewSetStatus is what it found and what it made of it.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastPolled:
                description: |-
                  LastPolled is when the forge last answered.

                  Recorded because "no environments appeared" has two very different causes —
                  nothing to create, or nobody asking — and they look identical from outside.
                format: date-time
                type: string
              message:
                description: Message says what went wrong, in the forge's words where
                  there are any.
                type: string
              observedGeneration:
                format: int64
                type: integer
              open:
                description: Open is how many environments this set currently has.
                format: int32
                type: integer
              skipped:
                description: |-
                  Skipped counts refs that matched but got no environment because the cap
                  was reached. Counted rather than silently dropped: a set quietly ignoring
                  half its pull requests looks exactly like one that is working.
                format: int32
                type: integer
              tracked:
                description: Tracked is one entry per ref that currently has an environment.
                items:
                  description: TrackedRef is one pull request or branch, and the environment
                    it became.
                  properties:
                    createdAt:
                      format: date-time
                      type: string
                    kind:
                      description: Kind says which sort of ref this is.
                      enum:
                      - PullRequest
                      - Branch
                      type: string
                    name:
                      description: Name is the environment's name, which is derived
                        from the ref.
                      type: string
                    number:
                      description: Number is the pull request number, when there is
                        one.
                      format: int32
                      type: integer
                    ref:
                      description: Ref is the branch, or the pull request's head branch.
                      type: string
                    title:
                      description: |-
                        Title is the pull request's title, so the list reads like the tab the
                        person came from rather than like a list of branch names.
                      type: string
                    url:
                      description: URL is the pull request on the forge.
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
